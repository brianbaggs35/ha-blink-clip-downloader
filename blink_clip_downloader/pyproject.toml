[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blink-downloader"
version = "4.1.0"
description = "Home Assistant add-on: Blink Clip Downloader"
authors = [{name = "Brian Baggs", email = "brianbaggs@hotmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "blinkpy>=0.25.7",
    "aiohttp>=3.14.1",
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "python-slugify>=8.0.4",
    "python-dateutil>=2.9.0",
    "aiosmtplib>=5.1.2",
    "Pillow>=12.3.0",
    "anthropic>=0.116.0",
    "openai>=2.44.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "aioresponses>=0.7.9",
    "PyYAML>=6.0.1",
]
# Optional computer-vision enhancement pipeline (see vision.py and the
# ai_object_detection_enabled/ai_depth_estimation_enabled/
# ai_segmentation_enabled/ai_face_recognition_enabled config options — all
# off by default). Not needed to run or test the add-on's core features;
# only install this extra if you want to exercise the CV pipeline locally.
# torch should be installed first from https://download.pytorch.org/whl/cpu
# per PyTorch's own guidance (see Dockerfile) to avoid pulling its much
# larger default CUDA build — this extra intentionally leaves torch itself
# unpinned to whatever is already installed rather than re-resolving it.
vision = [
    "ultralytics>=8.3,<9",
    "opencv-python-headless>=4.10,<5",
    "transformers>=4.56,<5",
    "facenet-pytorch>=2.6,<3",
]

[tool.setuptools.packages.find]
include = ["blink_downloader*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["blink_downloader"]
omit = [
    "tests/*",
    "blink_downloader/__main__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pyright]
include = ["blink_downloader", "tests"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/node_modules",
    "build",
    "dist",
    "**/.*"
]

pythonVersion = "3.12"
typeCheckingMode = "standard"

reportMissingImports = "error"
reportMissingTypeStubs = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"

# Important for Home Assistant + Blink API dynamic responses
reportOptionalMemberAccess = "warning"
reportOptionalOperand = "warning"
reportGeneralTypeIssues = "warning"
