[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blink-downloader"
version = "3.2.0"
description = "Home Assistant add-on: Blink Clip Downloader"
authors = [{name = "Brian Baggs", email = "brianbaggs@hotmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "blinkpy>=0.25.7",
    "aiohttp>=3.14.1",
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "python-slugify>=8.0.4",
    "python-dateutil>=2.9.0",
    "aiosmtplib>=5.1.2",
    "Pillow>=12.3.0",
    "anthropic>=0.115.1",
    "openai>=2.44.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "aioresponses>=0.7.9",
]

[tool.setuptools.packages.find]
include = ["blink_downloader*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["blink_downloader"]
omit = [
    "tests/*",
    "blink_downloader/__main__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pyright]
include = ["blink_downloader", "tests"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/node_modules",
    "build",
    "dist",
    "**/.*"
]

pythonVersion = "3.12"
typeCheckingMode = "standard"

reportMissingImports = "error"
reportMissingTypeStubs = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"

# Important for Home Assistant + Blink API dynamic responses
reportOptionalMemberAccess = "warning"
reportOptionalOperand = "warning"
reportGeneralTypeIssues = "warning"
