[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blink-downloader"
version = "5.4.2"
description = "Home Assistant add-on: Blink Clip Downloader"
authors = [{name = "Brian Baggs", email = "brianbaggs@hotmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "blinkpy>=0.25.9",
    "aiohttp>=3.14.3",
    "aiofiles>=25.1.0",
    "asyncpg>=0.31.0",
    "python-slugify>=8.0.4",
    "python-dateutil>=2.9.0",
    "aiosmtplib>=5.1.2",
    "Pillow>=12.3.0",
    "anthropic>=0.121.0",
    "openai>=2.53.0",
    "numpy>=2.5.1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "aioresponses>=0.7.9",
    "PyYAML>=6.0.3",
]
# Optional computer-vision enhancement pipeline (see vision.py and the
# ai_enhanced_detection_enabled/ai_face_recognition_enabled config options —
# both off by default). Not needed to run or test the add-on's core features;
# only install this extra if you want to exercise the CV pipeline locally.
# numpy is NOT part of this extra — it's a core dependency above, since
# tests/test_vision.py exercises real array/image plumbing unconditionally
# (only torch/ultralytics/opencv/transformers/facenet-pytorch are mocked
# there) and it's lightweight compared to the packages below.
# See the Dockerfile for the exact install order/flags this mirrors and why
# each is needed:
#   1. torch + torchvision from https://download.pytorch.org/whl/cpu (both —
#      not just torch — or torchvision resolves an ABI-incompatible build
#      from default PyPI: "RuntimeError: operator torchvision::nms does not
#      exist" at import time).
#   2. ultralytics/opencv-python-headless/transformers normally.
#   3. facenet-pytorch with --no-deps (its pinned Pillow<10.3.0 has no
#      Python 3.13 wheel and conflicts with this project's own
#      Pillow>=12.3.0 — its actual runtime code works fine with modern
#      Pillow, only the stale pin is broken).
vision = [
    "ultralytics>=8.3,<9",
    # Cap raised from <5 to <6 after verifying both cv2 call sites this add-on
    # actually uses (FramePreprocessor.enhance's imdecode/cvtColor/CLAHE/
    # fastNlMeansDenoisingColored/imencode chain, and ContactDetector's
    # cv2.dilate) produce identical shapes/dtypes and identical
    # behaviorally-significant output under opencv-python-headless 5.0.0
    # versus the previous 4.10.0 floor — checked by hand in isolated venvs,
    # not just "no import error." No known CVEs in either line at the time
    # of this bump (checked via pip-audit).
    "opencv-python-headless>=4.10,<6",
    "transformers>=5.5,<6",
    "facenet-pytorch>=2.6,<3",
]

[tool.setuptools.packages.find]
include = ["blink_downloader*"]

[tool.setuptools.package-data]
# The built Vue app (see frontend/, vite.config.ts's outDir, and the
# Dockerfile's frontend-builder stage, which populates this directory before
# `pip3 install /app` runs) — setuptools only includes .py files by default,
# so without this the wheel silently drops index.html/assets/favicon.svg and
# _handle_index (media_server.py) 500s at runtime with no build-time signal.
blink_downloader = ["static/**/*"]

[tool.ruff.lint.isort]
# Without this, ruff's first-party/third-party import grouping is decided
# by an auto-detection heuristic that depends on the CWD/path ruff is
# invoked with — `ruff check .` from blink_clip_downloader/ (this
# project's documented local convention) and `ruff check
# blink_clip_downloader` from the repo root (CI's actual invocation, see
# ci.yaml) disagreed on whether blink_downloader.* belongs in the same
# import group as third-party packages like pytest, so a file could pass
# locally and fail in CI (or vice versa) with no code difference at all.
# Pinning this explicitly makes the grouping deterministic regardless of
# invocation style.
known-first-party = ["blink_downloader"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"
filterwarnings = [
    # OpenCV's SWIG-generated bindings (cv2) emit this on import under
    # Python 3.12+ — a known upstream quirk in the compiled extension
    # module itself, harmless and outside this project's control.
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]

[tool.coverage.run]
source = ["blink_downloader"]
omit = [
    "tests/*",
    "blink_downloader/__main__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pyright]
include = ["blink_downloader", "tests"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/node_modules",
    "build",
    "dist",
    "**/.*"
]

pythonVersion = "3.12"
typeCheckingMode = "standard"

reportMissingImports = "error"
reportMissingTypeStubs = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"

# Important for Home Assistant + Blink API dynamic responses
reportOptionalMemberAccess = "warning"
reportOptionalOperand = "warning"
reportGeneralTypeIssues = "warning"

[tool.bandit]
# Run as: bandit -c blink_clip_downloader/pyproject.toml -r blink_clip_downloader
# (requires bandit[toml]).
#
# tests/ is pytest code — its thousands of asserts (B101) and fixture
# credentials like "hunter2" (B105/B106) are the whole point of a test suite,
# not security findings. frontend/ and local-test/ hold no shipped Python
# (and local-test/data may contain an unreadable postgres dir that would
# abort the scan).
exclude_dirs = ["tests", "frontend", "local-test"]
# B101: production asserts here are `assert x is not None` type-narrowing for
#   pyright; the add-on always runs plain python3 (never -O), so they are not
#   stripped at runtime.
# B608: every query in database.py is ?-parameterized via _qm() — the pieces
#   interpolated into SQL f-strings are internal constants (fixed sort maps,
#   computed UTC offsets, "?" placeholder lists), never user input. Bandit
#   can't see through the assembly, and `# nosec` cannot suppress findings it
#   reports on the opening line of a multiline f-string, so the check is
#   skipped globally — keep new SQL parameterized.
skips = ["B101", "B608"]
