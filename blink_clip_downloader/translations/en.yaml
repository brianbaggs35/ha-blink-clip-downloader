---
configuration:
  username:
    name: Blink Username
    description: Your Blink account email address.
  password:
    name: Blink Password
    description: Your Blink account password.
  download_path:
    name: Download Path
    description: >-
      Absolute path where clips are saved. Must be under /share/ so the
      HA media browser can see them (e.g. /share/blink-clips).
  organize_by_camera:
    name: Organise by Camera
    description: Create a sub-folder per camera name.
  organize_by_date:
    name: Organise by Date
    description: Create a sub-folder per recording date (YYYY-MM-DD).
  filename_format:
    name: Filename Format
    description: >-
      Template for clip filenames. Available tokens: {camera}, {timestamp},
      {date}, {time}, {id}. Extension (.mp4) is appended automatically.
  poll_interval:
    name: Poll Interval (seconds)
    description: How often to check Blink for new clips (30–3600 s).
  max_clips_per_poll:
    name: Max Clips per Poll
    description: Maximum number of clips downloaded in a single poll cycle.
  retention_days:
    name: Retention (days)
    description: >-
      Delete clips older than this many days. Set to 0 to keep all clips
      forever.
  max_storage_gb:
    name: Storage Quota (GB)
    description: >-
      Stop downloading when the download folder exceeds this size. Set to 0
      for unlimited.
  camera_filter:
    name: Camera Whitelist
    description: >-
      Only download from these cameras (exact names as shown in the Blink app).
      Leave empty to download from all cameras.
  motion_only:
    name: Motion-Triggered Only
    description: Skip clips that were not triggered by motion (PIR sensor).
  time_window_start:
    name: Time Window Start
    description: >-
      Only download clips recorded at or after this time (HH:MM, 24-h).
      Leave blank to disable the filter.
  time_window_end:
    name: Time Window End
    description: >-
      Only download clips recorded at or before this time (HH:MM, 24-h).
      Leave blank to disable the filter.
  download_thumbnails:
    name: Download Thumbnails
    description: Also save the JPEG thumbnail alongside each clip.
  concurrent_downloads:
    name: Concurrent Downloads
    description: Number of clips downloaded in parallel (1–10).
  retry_attempts:
    name: Retry Attempts
    description: How many times to retry a failed download before skipping.
  retry_delay:
    name: Retry Delay (seconds)
    description: >-
      Seconds to wait between retry attempts. The delay is multiplied by the
      attempt number (e.g. 5 s, 10 s, 15 s). Range 0–300 s.
  notify_ha:
    name: HA Notifications
    description: >-
      Send a persistent Home Assistant notification every time new clips
      arrive, plus the daily digest and system events (2FA required, auth
      failures, storage full). This shows in the HA notification panel, not
      as a phone push — for suspicious-clip alerts specifically (without the
      per-download noise), use Enable Home Assistant Alerts below instead.
  ha_notification_title:
    name: Notification Title
    description: Title used for Home Assistant persistent notifications.
  webhook_url:
    name: Webhook URL
    description: >-
      Optional HTTP(S) URL to POST clip metadata to after each successful
      download. Leave blank to disable.
  create_clip_manifest:
    name: Create Clip Manifest
    description: >-
      Maintain a JSON manifest at /data/clip_manifest.json with metadata for
      every downloaded clip.
  min_clip_duration:
    name: Minimum Clip Duration (seconds)
    description: >-
      Skip clips shorter than this duration in seconds. Set to 0 to keep all
      clips regardless of length.
  enable_library_db:
    name: Enable Clip Library Database
    description: >-
      Store clip metadata in a PostgreSQL database to power the web library UI,
      daily digest, and archiving features.
  enable_media_server:
    name: Enable Web Library UI
    description: >-
      Start the built-in web server on the configured port so you can browse,
      search, star, and stream saved clips from any browser.
  media_server_port:
    name: Web UI Port
    description: TCP port for the clip library web server (default 8099).
  watch_ha_events:
    name: Watch HA Motion Events
    description: >-
      Subscribe to Home Assistant state_changed events and trigger an immediate
      Blink poll when a motion sensor fires, so clips appear within seconds.
  fast_poll_duration:
    name: Fast-Poll Duration (seconds)
    description: >-
      How long to stay in fast-poll mode after a motion event is detected
      (default 120 s).
  fast_poll_interval:
    name: Fast-Poll Interval (seconds)
    description: >-
      Poll interval while in fast-poll mode triggered by a motion event
      (default 15 s, min 5 s).
  post_motion_delay:
    name: Post-Motion Download Delay (seconds)
    description: >-
      How many seconds to wait after a Blink motion sensor clears before
      polling for the new clip. Blink typically takes 15–60 seconds to encode
      and upload a clip after motion ends. Default is 30 s (range 5–300 s).
  event_cameras:
    name: Event Camera Filter
    description: >-
      Only trigger fast-poll mode for motion events from these cameras. Leave
      empty to react to all Blink cameras.
  digest_enabled:
    name: Enable Daily Digest
    description: >-
      Send a daily Home Assistant notification summarising how many clips were
      downloaded and how much storage is in use.
  digest_time:
    name: Daily Digest Time (HH:MM)
    description: >-
      Local time at which the daily digest notification is sent (24-hour format,
      e.g. "08:00").
  archive_enabled:
    name: Enable ZIP Archiving
    description: >-
      Compress clips older than the archive threshold into monthly ZIP files to
      reclaim disk space while retaining metadata.
  archive_after_days:
    name: Archive After (days)
    description: >-
      Clips older than this many days are compressed into a ZIP archive (only
      when archiving is enabled).
  download_local_storage:
    name: Download Sync Module Local Storage
    description: >-
      Also download clips stored on the USB drive attached to the Blink Sync
      Module. Blink uploads these to the cloud before they can be fetched, so
      an internet connection is still required.
  ai_analysis_enabled:
    name: Enable AI Video Analysis
    description: >-
      Automatically analyse each downloaded clip for suspicious activity and
      send alerts via Discord, email, or the HA mobile app.
  ai_provider:
    name: AI Provider
    description: >-
      Which AI backend to use. "ollama" = local Ollama server on your LAN (free,
      private). "ollama_cloud" = Ollama Cloud API (paid). "moondream_cloud" =
      Moondream Cloud API (paid, uses object-detect + reasoning for better
      accuracy). "moondream_local" = Moondream 0.5B on-device (free, x86_64
      only). "anthropic" = Claude API (paid). "openai" = OpenAI GPT API (paid).
  ollama_url:
    name: Ollama Server URL
    description: >-
      URL of your Ollama instance, e.g. http://192.168.1.10:11434.
      Required for the "ollama" and "ollama_cloud" providers.
  ollama_model:
    name: Ollama Vision Model
    description: >-
      Vision-capable model to use on your Ollama server, e.g. llava:7b or
      llama3.2-vision:11b. Use "Fetch Models" in the web UI AI tab to see
      what is available.
  ollama_cloud_api_key:
    name: Ollama Cloud API Key
    description: API key from api.ollama.com. Required when ai_provider is "ollama_cloud".
  moondream_api_key:
    name: Moondream API Key
    description: API key from moondream.ai. Required when ai_provider is "moondream_cloud".
  moondream_finetune_model:
    name: Moondream Fine-Tune Model (optional)
    description: >-
      Fine-tuned checkpoint model ID to use for inference instead of the base
      model, e.g. "moondream3-preview/abc123@50". Leave empty to use the base
      model. Set this via the AI tab's Fine-Tuning panel (Activate button)
      rather than typing it by hand — that panel lists your actual
      fine-tunes/checkpoints. A value set live via the panel takes effect
      immediately but only persists across restarts if also saved here.
  anthropic_api_key:
    name: Anthropic API Key
    description: >-
      API key from console.anthropic.com. Required when ai_provider is
      "anthropic". Keep this secret.
  anthropic_model:
    name: Anthropic Model
    description: >-
      Claude model to use. claude-haiku-4-5 is the most cost-effective option
      for security camera analysis. Use "Fetch Models" in the web UI AI tab.
  openai_api_key:
    name: OpenAI API Key
    description: >-
      API key from platform.openai.com. Required when ai_provider is "openai".
      Keep this secret.
  openai_model:
    name: OpenAI Model
    description: >-
      GPT model to use. gpt-4o-mini is the most cost-effective vision option.
      Use "Fetch Models" in the web UI AI tab.
  openai_escalation_model:
    name: OpenAI Escalation Model (deprecated)
    description: >-
      Deprecated — use Enable Tier-2 Escalation and AI Escalation
      Provider/Model below instead, which work for every provider, not just
      OpenAI. Leave this blank. Existing values are still read and
      auto-migrated to the fields below on startup.
  ai_escalation_enabled:
    name: Enable Tier-2 Escalation
    description: >-
      Turns two-tier escalation on or off. When enabled, every clip is first
      analyzed with AI Provider above (tier 1); only clips tier 1 flags as
      suspicious are re-analyzed by AI Escalation Provider below (tier 2) for
      a closer second opinion, and that verdict is what gets recorded. Most
      clips are not suspicious, so pairing a cheap tier-1 model with a
      stronger tier-2 model saves on API cost/tokens compared to running the
      stronger model on every clip. When disabled, AI Escalation Provider and
      Model below are ignored entirely and analysis runs on tier 1 alone.
  ai_escalation_provider:
    name: AI Escalation Provider
    description: >-
      Tier-2 provider for two-tier escalation, only used when Enable Tier-2
      Escalation above is on. May be a different provider than AI Provider
      (e.g. tier 1 = openai, tier 2 = moondream_cloud) — reuses that
      provider's own credentials already set above, no separate API key
      needed.
  ai_escalation_model:
    name: AI Escalation Model (optional)
    description: >-
      Model ID to use for AI Escalation Provider above, e.g. "gpt-4o",
      "claude-opus-4-5", or a Moondream fine-tune ID. Leave empty to use that
      provider's default/base model. Not applicable to moondream_local, which
      has no selectable model.
  ai_prompt:
    name: AI Analysis Prompt
    description: >-
      Base prompt sent to the AI for every clip. Must request a JSON response
      with "suspicious", "confidence", and "description" keys. Override per
      camera via ai_camera_prompts or the Camera Configurations section in the
      web UI.
  ai_car_description:
    name: Protected Vehicle Description
    description: >-
      Optional description of a vehicle to protect, e.g. "Silver Kia Forte,
      parked in the driveway". When set the AI applies strict distance rules
      and flags anyone touching the vehicle as suspicious. Entering a
      description in the Vehicles tab of the web UI overrides this setting
      permanently — once saved there, this option is ignored regardless of
      what you set it to here; edit the Vehicles tab directly instead.
  ai_max_frames:
    name: Max Frames per Clip
    description: >-
      Number of frames extracted per clip for analysis (1–100). More frames
      give better coverage but increase API cost and analysis time. For
      moondream_cloud each frame uses additional API requests.
  ai_frame_interval:
    name: Frame Interval (seconds)
    description: >-
      Extract one frame every this many seconds of video. With 5 frames and
      2 s interval the analysis covers approximately the first 8 s of the clip.
  ai_suspicious_keywords:
    name: Suspicious Keywords
    description: >-
      Words that trigger a suspicious flag when found in the AI plain-text
      response. Used as a fallback when the AI does not return valid JSON.
  ai_schedule_start:
    name: AI Schedule Start (HH:MM)
    description: >-
      Only run AI analysis between this time and ai_schedule_end (24-hour local
      time). Leave blank to run analysis around the clock.
  ai_schedule_end:
    name: AI Schedule End (HH:MM)
    description: >-
      Stop running AI analysis after this time (24-hour local time). Leave blank
      to run analysis around the clock.
  ai_batch_size:
    name: AI Batch Size
    description: >-
      Maximum number of clips to analyse in one batch before pausing for
      ai_check_interval seconds. Prevents overloading the AI backend.
  ai_check_interval:
    name: AI Check Interval (seconds)
    description: >-
      Seconds between analysis batch runs. The queue is checked this often for
      new un-analysed clips.
  ai_min_confidence:
    name: Minimum Alert Confidence
    description: >-
      Minimum AI confidence score (0.0–1.0) required before a suspicious-clip
      alert is dispatched. Results are always stored regardless of this setting.
      0.0 = alert on all results; 0.5 = only when the AI is reasonably certain.
  ai_camera_prompts:
    name: Per-Camera AI Prompts
    description: >-
      Override the global ai_prompt for specific cameras. Each entry has a
      "camera" name (must exactly match a camera name shown in the Blink app)
      and a "prompt" string. Cameras not listed use ai_prompt. Prefer the web
      UI AI tab under Camera Configurations instead — it lists your actual
      camera names so there is nothing to type or get wrong.
  ai_camera_descriptions:
    name: Per-Camera Descriptions
    description: >-
      Context descriptions injected into every AI prompt for the matching
      camera, e.g. "Points at driveway; Silver Kia Forte parked on left". The
      "camera" name must exactly match a camera name shown in the Blink app.
      Prefer editing live in the web UI AI tab under Camera Configurations
      instead — it lists your actual camera names so there is nothing to type
      or get wrong.
  ai_frame_strategy:
    name: Frame Extraction Strategy
    description: >-
      "smart" (default) extracts 2x frames then picks entry, peak-motion, and
      exit frames using motion-diff. "sequential" analyses each frame
      individually and returns the most alarming result. "uniform" is the legacy
      fixed-interval mode.
  ai_car_cameras:
    name: Car-Protection Cameras
    description: >-
      Restrict protected-vehicle distance rules to these camera names (must
      exactly match a camera name shown in the Blink app). Cameras not in this
      list focus on their own description and will not apply car proximity
      rules. Leave empty to apply car rules to all cameras. Prefer the
      "Protected vehicle visible from this camera" checkbox in the web UI AI
      tab under Camera Configurations instead — it lists your actual camera
      names so there is nothing to type or get wrong.
  ai_prompt_debug_enabled:
    name: Enable Prompt Debug Logging
    description: >-
      Store each clip's exact prompt text (not the image frames) so it can be
      inspected via the "📝 Prompt" button on that clip's AI panel — open any
      clip from the web UI's Library tab to see it — useful for understanding
      and fine-tuning what's actually being sent. Off by default since
      prompts are long and this is an opt-in debugging aid.
  ai_enhanced_detection_enabled:
    name: "⚠️ Enable Enhanced Detection & Tracking (heavy)"
    description: >-
      Frame preprocessing (contrast/denoise), object detection + tracking
      (YOLO + ByteTrack), monocular depth estimation (Depth Anything V2), and
      pixel-level contact segmentation (SAM2) — one switch for all four,
      feeding the AI precise, code-computed detection/tracking/depth/contact
      hints instead of relying on motion-diff heuristics alone. Downloads
      several models (100MB-800MB+ combined) on first use and requires
      substantially more CPU/RAM than the rest of this add-on. Comfortable on
      a Raspberry Pi 5 (8GB) or better. Off by default; analysis works
      exactly the same without it.
  ai_object_detection_model:
    name: Object Detection Model
    description: >-
      Ultralytics model file the detection stage above runs — enter exactly
      one of: yolo11n.pt (nano — fastest/lightest, recommended starting
      point on CPU-only hardware), yolo11s.pt (small), yolo11m.pt (medium),
      yolo11l.pt (large), or yolo11x.pt (extra-large — most accurate, much
      slower). Downloaded automatically on first use; defaults to
      yolo11n.pt.
  ai_face_recognition_enabled:
    name: Enable Local Face Recognition
    description: >-
      Suppress alerts for enrolled household members. Enrollment (reference
      photos, computed face embeddings) happens entirely on-device via the
      web UI's AI tab and never leaves this add-on or your network — it is
      never sent to any cloud AI provider, regardless of which one is
      configured above. Off by default.
  mobile_app_target:
    name: Mobile App Target Entity
    description: >-
      Home Assistant mobile app notification entity to send suspicious-clip
      alerts to, e.g. mobile_app_my_phone. Required when mobile_app_enabled is
      true.
  mobile_app_enabled:
    name: Enable Mobile App Alerts
    description: >-
      Send a push notification to the HA mobile app when a suspicious clip is
      detected.
  smtp_host:
    name: SMTP Host
    description: Hostname or IP address of the SMTP server for email alerts.
  smtp_port:
    name: SMTP Port
    description: >-
      SMTP server port. Use 587 for STARTTLS (recommended) or 465 for SSL.
  smtp_user:
    name: SMTP Username
    description: Login username for the SMTP server (usually your email address).
  smtp_password:
    name: SMTP Password
    description: Login password for the SMTP server. Keep this secret.
  smtp_recipients:
    name: Email Alert Recipients
    description: >-
      List of email addresses to send suspicious-clip alerts to. At least one
      address is required when smtp_enabled is true.
  smtp_sender:
    name: Email Sender Address
    description: From address used in outgoing alert emails.
  smtp_enabled:
    name: Enable Email Alerts
    description: >-
      Send an email alert with a clip summary when suspicious activity is
      detected.
  discord_webhook_url:
    name: Discord Webhook URL
    description: >-
      Discord webhook URL to post suspicious-clip alerts to. Leave blank to
      disable Discord notifications.
  discord_enabled:
    name: Enable Discord Alerts
    description: >-
      Post a Discord message with clip details when suspicious activity is
      detected.
  notify_ha_suspicious:
    name: Enable Home Assistant Alerts
    description: >-
      Create a Home Assistant persistent notification only when suspicious
      activity is detected — independent of HA Notifications above, which
      covers every new clip download plus the daily digest and system
      events. Like that option, this shows in HA's own notification panel,
      not as a phone push; for an actual push notification to your phone,
      also enable Enable Mobile App Alerts above.
  log_level:
    name: Log Level
    description: Verbosity of add-on logs.
