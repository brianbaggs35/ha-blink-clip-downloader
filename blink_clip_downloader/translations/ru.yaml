---
configuration:
  username:
    name: Имя пользователя Blink
    description: Адрес электронной почты вашей учётной записи Blink.
  password:
    name: Пароль Blink
    description: Пароль вашей учётной записи Blink.
  download_path:
    name: Путь для загрузки
    description: >-
      Абсолютный путь, по которому сохраняются клипы. Должен находиться
      внутри /share/, чтобы медиабраузер HA мог их видеть (например,
      /share/blink-clips).
  organize_by_camera:
    name: Группировать по камере
    description: Создаёт отдельную подпапку для каждой камеры.
  organize_by_date:
    name: Группировать по дате
    description: Создаёт отдельную подпапку для каждой даты записи (YYYY-MM-DD).
  filename_format:
    name: Формат имени файла
    description: >-
      Шаблон для имён файлов клипов. Доступные подстановки: {camera},
      {timestamp}, {date}, {time}, {id}. Расширение (.mp4) добавляется
      автоматически.
  poll_interval:
    name: Интервал опроса (секунды)
    description: Как часто проверять Blink на наличие новых клипов (30–3600 с).
  max_clips_per_poll:
    name: Макс. число клипов за опрос
    description: Максимальное количество клипов, загружаемых за один цикл опроса.
  retention_days:
    name: Хранение (дней)
    description: >-
      Удалять клипы старше указанного числа дней. Установите 0, чтобы
      хранить все клипы бессрочно.
  max_storage_gb:
    name: Квота хранилища (ГБ)
    description: >-
      Останавливает загрузку, когда папка для загрузок превышает этот
      размер. Установите 0 для снятия ограничения.
  camera_filter:
    name: Белый список камер
    description: >-
      Загружать только с этих камер (точные имена, как показано в
      приложении Blink). Оставьте пустым, чтобы загружать со всех камер.
  motion_only:
    name: Только по движению
    description: >-
      Пропускает клипы, которые не были запущены по движению (датчик
      PIR).
  time_window_start:
    name: Начало временного окна
    description: >-
      Загружать только клипы, записанные не раньше этого времени
      (HH:MM, 24-часовой формат). Оставьте пустым, чтобы отключить
      фильтр.
  time_window_end:
    name: Конец временного окна
    description: >-
      Загружать только клипы, записанные не позже этого времени
      (HH:MM, 24-часовой формат). Оставьте пустым, чтобы отключить
      фильтр.
  download_thumbnails:
    name: Загружать миниатюры
    description: Также сохранять миниатюру JPEG вместе с каждым клипом.
  concurrent_downloads:
    name: Параллельные загрузки
    description: Количество клипов, загружаемых одновременно (1–10).
  retry_attempts:
    name: Число повторных попыток
    description: >-
      Сколько раз повторять неудавшуюся загрузку, прежде чем пропустить
      клип.
  retry_delay:
    name: Задержка между попытками (секунды)
    description: >-
      Сколько секунд ждать между повторными попытками. Задержка
      умножается на номер попытки (например, 5 с, 10 с, 15 с).
      Диапазон 0–300 с.
  notify_ha:
    name: Уведомления HA
    description: >-
      Отправлять постоянное уведомление Home Assistant при каждом
      появлении новых клипов, а также для ежедневной сводки и системных
      событий (требуется 2FA, ошибки авторизации, переполнение
      хранилища). Уведомление появляется на панели уведомлений HA, а не
      как push-уведомление на телефон — для оповещений именно о
      подозрительных клипах (без «шума» от каждой загрузки) используйте
      вместо этого параметр «Включить оповещения Home Assistant» ниже.
  ha_notification_title:
    name: Заголовок уведомления
    description: Заголовок, используемый для постоянных уведомлений Home Assistant.
  webhook_url:
    name: URL вебхука
    description: >-
      Необязательный URL HTTP(S), на который отправляется (POST)
      метаданные клипа после каждой успешной загрузки. Оставьте пустым,
      чтобы отключить.
  create_clip_manifest:
    name: Создавать манифест клипов
    description: >-
      Ведёт JSON-манифест в /data/clip_manifest.json с метаданными
      каждого загруженного клипа.
  min_clip_duration:
    name: Минимальная длительность клипа (секунды)
    description: >-
      Пропускать клипы короче этой длительности в секундах. Установите
      0, чтобы сохранять все клипы независимо от длительности.
  enable_library_db:
    name: Включить базу данных библиотеки клипов
    description: >-
      Сохраняет метаданные клипов в базе данных PostgreSQL, которая
      обеспечивает работу веб-интерфейса библиотеки, ежедневной сводки
      и функций архивирования.
  enable_media_server:
    name: Включить веб-интерфейс библиотеки
    description: >-
      Запускает встроенный веб-сервер на указанном порту, чтобы можно
      было просматривать, искать, отмечать звёздочкой и воспроизводить
      сохранённые клипы из любого браузера.
  media_server_port:
    name: Порт веб-интерфейса
    description: TCP-порт веб-сервера библиотеки клипов (по умолчанию 8099).
  watch_ha_events:
    name: Отслеживать события движения HA
    description: >-
      Подписывается на события state_changed в Home Assistant и
      немедленно запускает опрос Blink при срабатывании датчика
      движения, чтобы клипы появлялись за считаные секунды.
  fast_poll_duration:
    name: Длительность быстрого опроса (секунды)
    description: >-
      Как долго оставаться в режиме быстрого опроса после обнаружения
      события движения (по умолчанию 120 с).
  fast_poll_interval:
    name: Интервал быстрого опроса (секунды)
    description: >-
      Интервал опроса в режиме быстрого опроса, запускаемом событием
      движения (по умолчанию 15 с, минимум 5 с).
  post_motion_delay:
    name: Задержка загрузки после движения (секунды)
    description: >-
      Сколько секунд ждать после окончания срабатывания датчика
      движения Blink перед опросом нового клипа. Blink обычно
      затрачивает 15–60 секунд на кодирование и загрузку клипа после
      окончания движения. По умолчанию 30 с (диапазон 5–300 с).
  event_cameras:
    name: Фильтр камер для событий
    description: >-
      Запускать режим быстрого опроса только для событий движения с
      этих камер. Оставьте пустым, чтобы реагировать на все камеры
      Blink.
  digest_enabled:
    name: Включить ежедневную сводку
    description: >-
      Отправляет ежедневное уведомление Home Assistant со сводкой о
      том, сколько клипов было загружено и сколько места занято в
      хранилище.
  digest_time:
    name: Время ежедневной сводки (HH:MM)
    description: >-
      Местное время, в которое отправляется уведомление с ежедневной
      сводкой (24-часовой формат, например «08:00»).
  archive_enabled:
    name: Включить архивирование в ZIP
    description: >-
      Сжимает клипы старше порога архивирования в ежемесячные
      ZIP-архивы, освобождая место на диске и сохраняя при этом
      метаданные.
  archive_after_days:
    name: Архивировать после (дней)
    description: >-
      Клипы старше этого числа дней сжимаются в ZIP-архив (только при
      включённом архивировании).
  gdrive_batch_size:
    name: Размер пакета загрузки в Google Drive
    description: >-
      Максимальное количество клипов, загружаемых в Google Drive за
      один цикл проверки.
  gdrive_check_interval:
    name: Интервал проверки Google Drive (секунды)
    description: >-
      Как часто очередь загрузки проверяет наличие клипов, ожидающих
      резервного копирования.
  download_local_storage:
    name: Загружать локальное хранилище Sync Module
    description: >-
      Также загружает клипы, хранящиеся на USB-накопителе, подключённом
      к Blink Sync Module. Blink сначала загружает их в облако, прежде
      чем их можно будет получить, поэтому подключение к интернету
      по-прежнему требуется.
  ai_analysis_enabled:
    name: Включить анализ видео с помощью ИИ
    description: >-
      Автоматически анализирует каждый загруженный клип на предмет
      подозрительной активности и отправляет оповещения через Discord,
      электронную почту или мобильное приложение HA.
  ai_provider:
    name: Провайдер ИИ
    description: >-
      Какой ИИ-движок использовать. «ollama» = локальный сервер Ollama
      в вашей сети (бесплатно, приватно). «ollama_cloud» = API Ollama
      Cloud (платно). «moondream_cloud» = API Moondream Cloud (платно,
      использует обнаружение объектов + рассуждение для повышения
      точности). «moondream_local» = Moondream 0.5B на устройстве
      (бесплатно, только x86_64). «anthropic» = API Claude (платно).
      «openai» = API OpenAI GPT (платно).
  ollama_url:
    name: URL сервера Ollama
    description: >-
      URL вашего экземпляра Ollama, например http://192.168.1.10:11434.
      Требуется для провайдеров «ollama» и «ollama_cloud».
  ollama_model:
    name: Модель зрения Ollama
    description: >-
      Модель с поддержкой распознавания изображений, используемая на
      вашем сервере Ollama, например llava:7b или llama3.2-vision:11b.
      Используйте «Fetch Models» на вкладке ИИ в веб-интерфейсе, чтобы
      увидеть доступные модели.
  ollama_cloud_api_key:
    name: API-ключ Ollama Cloud
    description: >-
      API-ключ с сайта api.ollama.com. Требуется, когда ai_provider
      установлен в «ollama_cloud».
  moondream_api_key:
    name: API-ключ Moondream
    description: >-
      API-ключ с сайта moondream.ai. Требуется, когда ai_provider
      установлен в «moondream_cloud».
  moondream_finetune_model:
    name: Дообученная модель Moondream (необязательно)
    description: >-
      Идентификатор дообученной контрольной точки (checkpoint),
      используемой для вывода вместо базовой модели, например
      «moondream3-preview/abc123@50». Оставьте пустым, чтобы
      использовать базовую модель. Устанавливайте это значение через
      панель «Fine-Tuning» на вкладке ИИ (кнопка Activate), а не вводите
      вручную — эта панель показывает ваши реальные дообученные
      модели/контрольные точки. Значение, заданное напрямую через
      панель, применяется немедленно, но сохраняется после перезапуска
      только если также сохранено здесь.
  anthropic_api_key:
    name: API-ключ Anthropic
    description: >-
      API-ключ с сайта console.anthropic.com. Требуется, когда
      ai_provider установлен в «anthropic». Держите в secret.
  anthropic_model:
    name: Модель Anthropic
    description: >-
      Используемая модель Claude. claude-haiku-4-5 — самый экономичный
      вариант для анализа камер видеонаблюдения. Используйте
      «Fetch Models» на вкладке ИИ в веб-интерфейсе.
  openai_api_key:
    name: API-ключ OpenAI
    description: >-
      API-ключ с сайта platform.openai.com. Требуется, когда
      ai_provider установлен в «openai». Держите в секрете.
  openai_model:
    name: Модель OpenAI
    description: >-
      Используемая модель GPT. gpt-4o-mini — самый экономичный вариант
      для анализа изображений. Используйте «Fetch Models» на вкладке
      ИИ в веб-интерфейсе.
  openai_escalation_model:
    name: Модель эскалации OpenAI (устарело)
    description: >-
      Устарело — используйте вместо этого параметры «Включить
      эскалацию уровня 2» и «Провайдер/модель эскалации ИИ» ниже,
      которые работают с любым провайдером, а не только с OpenAI.
      Оставьте это поле пустым. Существующие значения по-прежнему
      считываются и автоматически переносятся в поля ниже при запуске.
  ai_escalation_enabled:
    name: Включить эскалацию уровня 2
    description: >-
      Включает или отключает двухуровневую эскалацию. При включении
      каждый клип сначала анализируется указанным выше провайдером ИИ
      (уровень 1); только клипы, отмеченные уровнем 1 как подозрительные,
      повторно анализируются провайдером эскалации ИИ ниже (уровень 2)
      для более тщательной второй оценки, и именно этот вердикт
      сохраняется. Большинство клипов не являются подозрительными,
      поэтому сочетание дешёвой модели уровня 1 с более мощной моделью
      уровня 2 экономит стоимость API/токены по сравнению с запуском
      более мощной модели на каждом клипе. При отключении параметры
      «Провайдер эскалации ИИ» и «Модель» ниже полностью игнорируются,
      и анализ выполняется только на уровне 1.
  ai_escalation_provider:
    name: Провайдер эскалации ИИ
    description: >-
      Провайдер уровня 2 для двухуровневой эскалации, используется
      только когда включён параметр «Включить эскалацию уровня 2» выше.
      Может отличаться от провайдера ИИ (например, уровень 1 = openai,
      уровень 2 = moondream_cloud) — повторно использует учётные данные
      этого провайдера, уже указанные выше, отдельный API-ключ не
      требуется.
  ai_escalation_model:
    name: Модель эскалации ИИ (необязательно)
    description: >-
      Идентификатор модели для указанного выше провайдера эскалации
      ИИ, например «gpt-4o», «claude-opus-4-5» или идентификатор
      дообученной модели Moondream. Оставьте пустым, чтобы использовать
      модель этого провайдера по умолчанию/базовую модель. Не
      применимо к moondream_local, у которого нет выбираемой модели.
  ai_prompt:
    name: Промпт для анализа ИИ
    description: >-
      Базовый промпт, отправляемый ИИ для каждого клипа. Должен
      требовать ответ в формате JSON с ключами «suspicious»,
      «confidence» и «description». Можно переопределить для отдельной
      камеры через ai_camera_prompts или раздел «Конфигурации камер» в
      веб-интерфейсе.
  ai_car_description:
    name: Описание защищаемого автомобиля
    description: >-
      Необязательное описание автомобиля, который нужно защищать,
      например «Серебристая Kia Forte, припаркована на подъездной
      дорожке». При указании ИИ применяет строгие правила дистанции и
      отмечает как подозрительного любого, кто касается автомобиля.
      Ввод описания на вкладке «Транспорт» в веб-интерфейсе навсегда
      переопределяет этот параметр — после сохранения там этот параметр
      игнорируется независимо от того, что установлено здесь; вместо
      этого редактируйте напрямую на вкладке «Транспорт».
  ai_max_frames:
    name: Макс. число кадров на клип
    description: >-
      Количество кадров, извлекаемых из клипа для анализа (1–100).
      Больше кадров даёт лучшее покрытие, но увеличивает стоимость API
      и время анализа. Для moondream_cloud каждый кадр расходует
      дополнительные запросы API.
  ai_frame_interval:
    name: Интервал между кадрами (секунды)
    description: >-
      Извлекать один кадр каждые столько секунд видео. При 5 кадрах и
      интервале 2 с анализ охватывает примерно первые 8 секунд клипа.
  ai_suspicious_keywords:
    name: Подозрительные ключевые слова
    description: >-
      Слова, которые запускают отметку «подозрительно» при обнаружении
      в текстовом ответе ИИ. Используется как резервный вариант, когда
      ИИ не возвращает корректный JSON.
  ai_schedule_start:
    name: Начало расписания ИИ (HH:MM)
    description: >-
      Запускать анализ ИИ только в промежутке между этим временем и
      ai_schedule_end (местное время, 24-часовой формат). Оставьте
      пустым, чтобы анализировать круглосуточно.
  ai_schedule_end:
    name: Конец расписания ИИ (HH:MM)
    description: >-
      Прекращать анализ ИИ после этого времени (местное время,
      24-часовой формат). Оставьте пустым, чтобы анализировать
      круглосуточно.
  ai_batch_size:
    name: Размер пакета ИИ
    description: >-
      Максимальное количество клипов для анализа в одном пакете перед
      паузой в ai_check_interval секунд. Предотвращает перегрузку
      ИИ-движка.
  ai_check_interval:
    name: Интервал проверки ИИ (секунды)
    description: >-
      Количество секунд между запусками пакетов анализа. Очередь
      проверяется с этой частотой на наличие новых непроанализированных
      клипов.
  ai_min_confidence:
    name: Минимальная достоверность для оповещения
    description: >-
      Минимальный показатель уверенности ИИ (0,0–1,0), необходимый для
      отправки оповещения о подозрительном клипе. Результаты всегда
      сохраняются независимо от этого параметра. 0,0 = оповещать обо
      всех результатах; 0,5 = только когда ИИ достаточно уверен.
  ai_camera_prompts:
    name: Промпты ИИ по камерам
    description: >-
      Переопределяет глобальный ai_prompt для конкретных камер. Каждая
      запись содержит имя «camera» (должно точно совпадать с именем
      камеры, отображаемым в приложении Blink) и строку «prompt».
      Камеры, не указанные в списке, используют ai_prompt. Предпочтительнее
      использовать раздел «Конфигурации камер» на вкладке ИИ в
      веб-интерфейсе — там перечислены ваши реальные имена камер, так
      что вводить или ошибиться не в чем.
  ai_camera_descriptions:
    name: Описания по камерам
    description: >-
      Контекстные описания, добавляемые в каждый промпт ИИ для
      соответствующей камеры, например «Направлена на подъездную
      дорожку; слева припаркована серебристая Kia Forte». Имя «camera»
      должно точно совпадать с именем камеры, отображаемым в
      приложении Blink. Предпочтительнее редактировать напрямую в
      разделе «Конфигурации камер» на вкладке ИИ в веб-интерфейсе — там
      перечислены ваши реальные имена камер, так что вводить или
      ошибиться не в чем.
  ai_frame_strategy:
    name: Стратегия извлечения кадров
    description: >-
      «smart» (по умолчанию) извлекает вдвое больше кадров, а затем
      выбирает начальный кадр, кадр пика движения и конечный кадр с
      помощью анализа разницы движения. «sequential» анализирует
      каждый кадр по отдельности и возвращает самый тревожный
      результат. «uniform» — это старый режим с фиксированным
      интервалом.
  ai_car_cameras:
    name: Камеры для защиты автомобиля
    description: >-
      Ограничивает правила дистанции защиты автомобиля этими именами
      камер (должны точно совпадать с именем камеры, отображаемым в
      приложении Blink). Камеры, не входящие в этот список,
      сосредотачиваются на собственном описании и не применяют правила
      близости к автомобилю. Оставьте пустым, чтобы применять правила
      автомобиля ко всем камерам. Предпочтительнее использовать флажок
      «Защищаемый автомобиль виден с этой камеры» на вкладке ИИ в
      веб-интерфейсе, в разделе «Конфигурации камер» — там перечислены
      ваши реальные имена камер, так что вводить или ошибиться не в чем.
  ai_prompt_debug_enabled:
    name: Включить журнал отладки промптов
    description: >-
      Сохраняет точный текст промпта каждого клипа (но не кадры
      изображений), чтобы его можно было посмотреть с помощью кнопки
      «📝 Prompt» на панели ИИ этого клипа — откройте любой клип на
      вкладке «Библиотека» веб-интерфейса, чтобы увидеть его — полезно
      для понимания и настройки того, что именно отправляется. По
      умолчанию отключено, так как промпты длинные и это
      дополнительная функция отладки по желанию.
  ai_enhanced_detection_enabled:
    name: "⚠️ Включить расширенное обнаружение и слежение (ресурсоёмко)"
    description: >-
      Предобработка кадров (контраст/шумоподавление), обнаружение
      объектов и слежение (YOLO + ByteTrack), монокулярная оценка
      глубины (Depth Anything V2) и посегментное определение контакта
      на уровне пикселей (SAM2) — единый переключатель для всех четырёх
      функций, передающий ИИ точные, вычисленные кодом подсказки об
      обнаружении/слежении/глубине/контакте вместо использования только
      эвристик разницы движения. При первом использовании загружает
      несколько моделей (суммарно 100–800 МБ и более) и требует
      значительно больше CPU/RAM, чем остальная часть этого дополнения.
      Комфортно работает на Raspberry Pi 5 (8 ГБ) или лучше. По
      умолчанию отключено; анализ работает точно так же и без этой
      функции.
  ai_object_detection_model:
    name: Модель обнаружения объектов
    description: >-
      Файл модели Ultralytics, используемый на этапе обнаружения выше.
      YOLO26 (yolo26n/s/m/l/x.pt) — актуальное поколение: сквозной
      вывод (без отдельного NMS), легче и точнее YOLO11 при любом
      размере — и рекомендуемое значение по умолчанию;
      yolo11n/s/m/l/x.pt остаются доступными для совместимости с уже
      существующими конфигурациями. "n" (nano) — самая быстрая/лёгкая,
      рекомендуется для оборудования только с CPU; "s"/"m"/"l"/"x"
      меняют скорость на точность, при этом "x" (extra-large) самая
      точная, но значительно медленнее. Загружается автоматически при
      первом использовании.
  ai_depth_estimation_model:
    name: Модель оценки глубины
    description: >-
      Чекпойнт Depth Anything V2, используемый на этапе оценки глубины
      выше. "Small" (по умолчанию) — самая быстрая/лёгкая и
      лицензирована по Apache-2.0; "Base"/"Large" точнее, но
      медленнее/тяжелее — и лицензированы издателем по CC-BY-NC-4.0
      (только некоммерческое использование), в отличие от Apache-2.0 у
      "Small". Для типичного личного использования этого аддона в
      целях домашней безопасности это не проблема, но перед выбором
      "Base" или "Large" убедитесь, что такая лицензия подходит именно
      для вашей ситуации. Загружается автоматически при первом
      использовании.
  ai_face_recognition_enabled:
    name: Включить локальное распознавание лиц
    description: >-
      Подавляет оповещения для зарегистрированных членов семьи.
      Регистрация (эталонные фотографии, вычисленные векторы признаков
      лица) происходит полностью на устройстве через вкладку ИИ в
      веб-интерфейсе и никогда не покидает это дополнение или вашу
      сеть — данные никогда не отправляются облачному провайдеру ИИ,
      независимо от того, какой из них настроен выше. По умолчанию
      отключено.
  hf_token:
    name: Токен Hugging Face (необязательно)
    description: >-
      Необязательный токен доступа Hugging Face, используемый для
      аутентификации при загрузке моделей компьютерного зрения и
      увеличения лимитов скорости Hugging Face Hub. Создайте его на
      https://huggingface.co/settings/tokens. Держите в секрете.
  mobile_app_target:
    name: Целевая сущность мобильного приложения
    description: >-
      Сущность уведомлений мобильного приложения Home Assistant, на
      которую отправляются оповещения о подозрительных клипах,
      например mobile_app_my_phone. Требуется, когда mobile_app_enabled
      включён.
  mobile_app_enabled:
    name: Включить оповещения мобильного приложения
    description: >-
      Отправляет push-уведомление в мобильное приложение HA при
      обнаружении подозрительного клипа.
  smtp_host:
    name: Хост SMTP
    description: Имя хоста или IP-адрес SMTP-сервера для оповещений по электронной почте.
  smtp_port:
    name: Порт SMTP
    description: >-
      Порт SMTP-сервера. Используйте 587 для STARTTLS (рекомендуется)
      или 465 для SSL.
  smtp_user:
    name: Имя пользователя SMTP
    description: Имя пользователя для входа на SMTP-сервер (обычно ваш адрес электронной почты).
  smtp_password:
    name: Пароль SMTP
    description: Пароль для входа на SMTP-сервер. Держите в секрете.
  smtp_recipients:
    name: Получатели оповещений по почте
    description: >-
      Список адресов электронной почты, на которые отправляются
      оповещения о подозрительных клипах. Требуется хотя бы один адрес,
      если smtp_enabled включён.
  smtp_sender:
    name: Адрес отправителя писем
    description: Адрес отправителя, используемый в исходящих письмах с оповещениями.
  smtp_enabled:
    name: Включить оповещения по почте
    description: >-
      Отправляет оповещение по электронной почте со сводкой по клипу
      при обнаружении подозрительной активности.
  discord_webhook_url:
    name: URL вебхука Discord
    description: >-
      URL вебхука Discord, на который публикуются оповещения о
      подозрительных клипах. Оставьте пустым, чтобы отключить
      уведомления Discord.
  discord_enabled:
    name: Включить оповещения Discord
    description: >-
      Публикует сообщение Discord с деталями клипа при обнаружении
      подозрительной активности.
  notify_ha_suspicious:
    name: Включить оповещения Home Assistant
    description: >-
      Создаёт постоянное уведомление Home Assistant только при
      обнаружении подозрительной активности — независимо от
      «Уведомлений HA» выше, которые охватывают каждую новую загрузку
      клипа, а также ежедневную сводку и системные события. Как и тот
      параметр, это уведомление появляется на собственной панели
      уведомлений HA, а не как push-уведомление на телефон; для
      настоящего push-уведомления на телефон дополнительно включите
      «Включить оповещения мобильного приложения» выше.
  log_level:
    name: Уровень журналирования
    description: Подробность журналов дополнения.
  battery_alerts_enabled:
    name: Включить оповещения о батарее
    description: Отправляет оповещение, когда заряд батареи камеры низкий.
