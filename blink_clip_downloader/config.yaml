---
name: Blink Clip Downloader
version: "v5.0.0"
slug: blink_clip_downloader
description: >-
  Downloads Blink camera clips locally with AI-powered suspicious activity
  detection, retention policies, storage quotas, and a web clip library.
url: "https://github.com/brianbaggs35/ha-blink-clip-downloader"
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true

# Ingress provides a secure panel entry in the HA sidebar at no extra port.
ingress: true
panel_icon: mdi:cctv
panel_title: Blink Clips

map:
  - type: share
    read_only: false
  - type: data
    read_only: false

# Direct-access port (optional alternative to ingress).
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Clip library web UI (direct access)

options:
  # --- Credentials ---
  # Your Blink account email address.
  username: ""
  # Your Blink account password.
  password: ""

  # --- Storage ---
  # Where to save downloaded clips (must be under /share for HA persistence).
  download_path: "/share/blink-clips"
  # Create a sub-folder for each camera inside download_path.
  organize_by_camera: true
  # Create a YYYY/MM/DD sub-folder structure inside each camera folder.
  organize_by_date: true
  # Filename template. Supports {camera} and {timestamp}.
  filename_format: "{camera}_{timestamp}"

  # --- Polling ---
  # How often (seconds) to check Blink for new clips. Min 30, max 3600.
  poll_interval: 300
  # Maximum clips to download in a single poll cycle. Keeps each cycle fast.
  max_clips_per_poll: 50

  # --- Retention & quota ---
  # Delete clips older than this many days (0 = keep forever).
  retention_days: 30
  # Delete oldest clips when total library exceeds this size in GB.
  max_storage_gb: 10.0

  # --- Filtering ---
  # Only download clips from these cameras (leave empty for all cameras).
  camera_filter: []
  # Only download PIR motion-triggered clips (skip liveview and snapshots).
  motion_only: false
  # Only download clips recorded after this time of day (HH:MM, 24-hour, local time).
  time_window_start: ""
  # Only download clips recorded before this time of day (HH:MM, 24-hour, local time).
  time_window_end: ""
  # Skip clips shorter than this duration in seconds (0 = keep all).
  min_clip_duration: 0

  # --- Download options ---
  # Also download thumbnail images alongside each clip. Required for the
  # Vehicles tab's car-zone picker (both browsing clips and drawing the
  # zone use the thumbnail directly); the Biometrics tab's face enrollment
  # extracts its own frames on demand so it still works either way, but
  # the clip-browsing strip there also uses thumbnails and looks broken
  # without them. On by default so both tabs work out of the box; turn off
  # to save disk/bandwidth if you don't use either.
  download_thumbnails: true
  # Number of clips to download in parallel. Higher values use more bandwidth.
  concurrent_downloads: 3
  # How many times to retry a failed download before giving up.
  retry_attempts: 3
  # Seconds to wait between retry attempts.
  retry_delay: 5.0

  # --- HA notifications ---
  # Send a Home Assistant persistent notification each time a clip is downloaded.
  # Off by default: a real, continuously-syncing account can download clips
  # every poll cycle, and a persistent notification per clip quickly becomes
  # noise rather than a signal — opt in explicitly if you want it.
  notify_ha: false
  # Title shown in the HA notification.
  ha_notification_title: "Blink Clip Downloaded"

  # --- Extra features ---
  # POST a JSON payload to this URL each time a clip is downloaded (leave empty to disable).
  webhook_url: ""
  # Write a JSON manifest file listing all downloaded clips.
  create_clip_manifest: true

  # --- Clip library database ---
  # Enable the PostgreSQL clip library. Required for the web UI and AI analysis.
  enable_library_db: true

  # --- Media server / web UI ---
  # Enable the built-in web UI for browsing and playing clips.
  enable_media_server: true
  # TCP port the web UI listens on for direct (non-ingress) access.
  media_server_port: 8099

  # --- Event-driven instant download ---
  # Listen for HA motion events to trigger an immediate download without
  # waiting for the next poll cycle.
  watch_ha_events: true
  # How long (seconds) to run in fast-poll mode after a motion event.
  fast_poll_duration: 120
  # Poll interval (seconds) during fast-poll mode after a motion event.
  fast_poll_interval: 15
  # Wait this many seconds after a motion event before fetching the clip,
  # giving Blink time to finish recording and upload it.
  post_motion_delay: 30
  # Limit fast-poll to these cameras (leave empty to apply to all cameras).
  event_cameras: []

  # --- Daily digest ---
  # Send a daily summary notification with clip statistics.
  digest_enabled: true
  # Time of day (HH:MM, 24-hour, local time) to send the daily digest.
  digest_time: "08:00"

  # --- ZIP archiving ---
  # Move old clips into ZIP archives to save space while keeping records.
  archive_enabled: false
  # Archive clips that are older than this many days.
  archive_after_days: 60

  # --- Sync Module local storage (USB drive clips) ---
  # When enabled, each poll cycle also downloads clips stored on the physical
  # USB drive plugged into the Blink Sync Module.  These clips do not appear
  # in the normal Blink cloud feed.  Note: Blink has no direct LAN API for
  # the USB drive — clips are temporarily uploaded to the Blink cloud and then
  # fetched from there, so an internet connection is required even for
  # "local" storage clips.
  download_local_storage: false

  # --- AI Video Analysis ---
  # Enable AI analysis to automatically inspect each downloaded clip for suspicious
  # activity and send alerts via Discord, email, or the HA mobile app.
  ai_analysis_enabled: false
  # AI provider to use. Options:
  #   "ollama"          – Ollama server running a vision model on your LAN (free, private)
  #   "ollama_cloud"    – Ollama Cloud API (api.ollama.com, needs ollama_cloud_api_key)
  #   "moondream_cloud" – Moondream Cloud API (needs moondream_api_key, billed per request)
  #   "moondream_local" – Moondream 0.5B INT8 model, run on this device (free, requires an NVIDIA/Apple Silicon GPU)
  #   "anthropic"       – Anthropic Claude API (needs anthropic_api_key, billed per token)
  #   "openai"          – OpenAI API, e.g. GPT-4o / GPT-5 (needs openai_api_key, billed per token)
  ai_provider: "ollama"
  # [Ollama / Ollama Cloud] URL of your Ollama server, e.g. http://192.168.1.10:11434
  ollama_url: ""
  # [Ollama / Ollama Cloud] Vision model to use. Use "Fetch Models" in the web UI
  # to see available models on your server (e.g. llava:7b, llama3.2-vision:11b).
  ollama_model: ""
  # [Ollama Cloud] API key from api.ollama.com (leave empty for local Ollama).
  ollama_cloud_api_key: ""
  # [Moondream Cloud] API key from moondream.ai.
  moondream_api_key: ""
  # [Moondream Cloud] Fine-tuned checkpoint model ID to use for inference
  # instead of the base model, e.g. "moondream3-preview/abc123@50". Leave
  # empty to use the base model. Set this via the AI tab's Fine-Tuning panel
  # (Activate button) rather than typing it by hand — that panel lists your
  # actual fine-tunes/checkpoints. A value set live via the panel takes
  # effect immediately but only persists across restarts if also saved here.
  moondream_finetune_model: ""
  # [Anthropic] API key from console.anthropic.com. Keep this secret.
  anthropic_api_key: ""
  # [Anthropic] Claude model to use. Use "Fetch Models" in the web UI to see
  # available models. claude-haiku-4-5 is the most cost-effective option.
  anthropic_model: "claude-haiku-4-5"
  # [OpenAI] API key from platform.openai.com. Keep this secret.
  openai_api_key: ""
  # [OpenAI] GPT model to use. Use "Fetch Models" in the web UI to see available
  # models. gpt-4o-mini is the most cost-effective vision option.
  openai_model: "gpt-4o-mini"
  # Master on/off switch for two-tier escalation. When true, every clip is
  # first analyzed with ai_provider/model above (tier 1); only clips tier 1
  # flags as suspicious are re-analyzed by ai_escalation_provider/model
  # (tier 2) for a closer second opinion, and that verdict is what gets
  # recorded. When false, ai_escalation_provider/model below are ignored
  # entirely and analysis runs on tier 1 alone — this is the actual
  # disable switch; ai_escalation_provider itself is a required field (see
  # below) so it always has a real value to show in the dropdown.
  ai_escalation_enabled: false
  # Tier-2 provider for two-tier escalation, only used when
  # ai_escalation_enabled (above) is true. May be a DIFFERENT provider than
  # ai_provider (e.g. tier 1 = openai, tier 2 = moondream_cloud) — reuses
  # that provider's own credentials already set above, no separate API key
  # needed. Deliberately a required field with a real default rather than
  # optional/unset: HA Supervisor's Configuration UI never renders a row for
  # an optional select field that has no value in options.json, which made
  # it impossible to ever set this through the UI on a fresh install
  # (confirmed against a real Supervisor instance) — ai_escalation_enabled
  # above is the actual disable switch instead, so this can safely always
  # have a concrete value.
  ai_escalation_provider: "ollama"
  # Model ID to use for ai_escalation_provider above (e.g. "gpt-4o",
  # "claude-opus-4-5", or a moondream fine-tune ID). Leave empty to use that
  # provider's default/base model. Not applicable to moondream_local, which
  # has no selectable model.
  ai_escalation_model: ""
  # Base prompt sent to the AI for each clip. Must request a JSON response with
  # "suspicious", "confidence", and "description" keys. This is the global default;
  # use the Camera Configurations section in the web UI (AI tab) to override for
  # individual cameras, or set ai_camera_prompts below for advanced YAML-based config.
  # yamllint disable rule:line-length
  ai_prompt: |-
    You are a security camera analyst. Review this motion-triggered clip and determine if anything suspicious is happening.

    Step 1 — Identify what triggered the motion:
    - Person, animal, passing vehicle, shadow/reflection, wind/leaves, or environmental motion.
    - A car or shadow moving on a public road is NOT suspicious — distinguish carefully.

    Step 2 — If a person is present, observe:
    - Where they are standing or moving, and in which direction.
    - How close they are to any vehicles, doors, windows, or other property.
    - What they appear to be doing (walking past, lingering, reaching, running, etc.).
    - Lighting and visibility conditions.

    Step 3 — Apply these rules:
    SUSPICIOUS (suspicious=true) — ANY of these applies:
      • Person is prying, forcing, kicking, shouldering, or otherwise tampering with a locked door, window, or vehicle — not simply opening or using it normally.
      • Person repeatedly jiggles, pulls on, or manipulates a door handle or lock beyond a single normal key/fob/code use, or otherwise appears to be trying to force a lock.
      • Person attempts entry through a window, side gate, or any opening other than the normal front entrance.
      • Person touches, reaches for, covers, sprays, or otherwise tampers with a security camera itself.
      • A vehicle makes physical contact with — bumps, scrapes, or sideswipes — another vehicle or parked property, even a minor low-speed contact, regardless of whether the other party stops or drives away afterward.
      • Person scrapes, bangs into, kicks, or otherwise physically contacts a parked vehicle.
      • Person is crouching beside or hiding next to property.
      • Person repeatedly looks around, peers into windows or vehicles, or paces the property without any clear purpose (casing behavior) — favor flagging this as suspicious when in doubt, since this pattern is otherwise easy to miss.
      • Person picks up mail or a delivered package and then leaves the property on foot or by vehicle instead of entering the home — a mail/package theft signature.
      • Person runs away immediately after contacting property.
      • An animal (e.g. a dog) jumps on, paws at, or urinates/defecates on a vehicle or other protected property — flag this even though no person is involved.
      • Lawn equipment flings a rock, stick, or debris that visibly strikes a vehicle with force, or wind-blown debris (a trash can, lid, branch, or similar) visibly strikes, bounces off, dents, or scrapes a vehicle rather than merely resting against it — flag this even with no person at fault and even if unintentional; any event that visibly damages or risks damaging a protected asset is worth reporting.
    NOT SUSPICIOUS (suspicious=false):
      • A person walking up to the front door, unlocking or opening it normally, and going inside — this is ordinary coming and going (a resident or expected visitor) and must NOT be flagged just because they touched or opened the door.
      • A person opening the front door from inside and stepping out to leave — e.g. leaving for work, taking out trash or mail, or walking to a car — is exactly as routine as entering and must NOT be flagged simply for opening the door and walking away. Only flag it if the person then lingers, repeatedly looks around, or otherwise matches one of the SUSPICIOUS behaviors above (e.g. casing, running immediately after tampering) — opening a door and calmly walking off on its own is never enough.
      • A person walking up to a mailbox or porch, picking up mail or a package, and going back inside the home — this is the resident retrieving their own delivery and is routine even though the camera cannot confirm who they are; judge this by the retrieve-then-enter pattern, not by identity.
      • Person walking along a public road, sidewalk, or across the scene without stopping.
      • Person standing more than 3 feet from protected assets.
      • Vehicle, bicycle, or shadow passing on the street.
      • Animal, insect, or environmental motion (wind, leaves, lights).
      • Lawn care equipment (mower, trimmer, blower) being operated near a vehicle by a neighbor or landscaper, with no visible impact on the vehicle — routine yard maintenance, not suspicious.
      • Wind-blown debris — a trash can, lid, or branch — merely coming to rest against or blowing near a vehicle or property, with no person involved and no visible impact.
      • Delivery driver at the front door (under 60 seconds).
      • ANY of the above lawn-equipment or wind-blown-debris scenarios where the object visibly strikes, bounces off, dents, or scrapes the vehicle rather than merely resting near or against it is a DIFFERENT case — see SUSPICIOUS above. Damage or risk of damage to a protected asset is always worth reporting, even with no person at fault and even if unintentional.

    Confidence = how certain you are in the suspicious/not-suspicious verdict above, based on how clearly the BEHAVIOR itself is visible — NOT how bright or sharp the video looks. A dim or distant clip that still clearly shows tampering deserves high confidence; a bright, clear clip of ordinary activity is not suspicious regardless of image quality (0.1 = you can barely tell what is happening, 1.0 = the behavior is unambiguous). When genuinely uncertain whether behavior is suspicious (e.g. it could be casing or could be innocent loitering), prefer a lower-confidence suspicious=true over suppressing it entirely — occasional false positives are acceptable, but missing real suspicious activity is not.

    Respond ONLY with this exact JSON — no other text:
    {"suspicious": true/false, "confidence": 0.1-1.0, "description": "one short plain-English sentence naming the notable person, vehicle, or animal and what they are doing (e.g. 'A person is walking past the car' or 'A person is standing very close to the car and appears to be looking inside it') — omit static background scenery like parked vehicles that aren't involved, weather, foliage, or utility poles/power lines"}
  # yamllint enable rule:line-length
  # Optional description of a vehicle to protect. When set, the AI applies strict
  # distance rules and flags anyone within ~2 feet of the vehicle as suspicious.
  # Example: "Silver Kia Forte, parked in the driveway"
  # Entering a description in the Vehicles tab of the web UI overrides this
  # setting permanently — once saved there (even as blank), this option is
  # ignored regardless of what you set it to here; edit the Vehicles tab
  # directly instead.
  ai_car_description: ""
  # Number of frames extracted per clip for analysis (1–100). More frames = better
  # coverage of the full clip but higher API cost and analysis time.
  # For moondream_cloud, each frame = one API request (rate-limited to 2 req/s).
  ai_max_frames: 5
  # Extract one frame every this many seconds of video. With 5 frames and 2s interval,
  # analysis covers approximately the first 8 seconds of the clip.
  ai_frame_interval: 2.0
  # Words that trigger a "suspicious" flag when found in the AI's plain-text
  # response (used as fallback when the AI does not return JSON).
  ai_suspicious_keywords:
    - "suspicious"
    - "break-in"
    - "theft"
    - "vandalism"
    - "intruder"
    - "trespassing"
  # Only run AI analysis between these hours (HH:MM, 24-hour, leave empty for always-on).
  ai_schedule_start: ""
  ai_schedule_end: ""
  # Maximum clips to analyse in one batch before waiting for ai_check_interval.
  ai_batch_size: 10
  # Seconds between analysis batch runs.
  ai_check_interval: 60
  # Minimum confidence threshold (0.0–1.0) for sending suspicious-activity alerts.
  # 0.0 = send alerts for all results; 0.3 = suppress low-confidence detections;
  # 0.5 (default) = only alert when the AI is reasonably certain — this matches
  # the confidence floor the AI is itself instructed to use for a genuine
  # suspicious verdict, so low-confidence hedges don't spam notifications.
  # Results are always stored regardless of this setting.
  ai_min_confidence: 0.5
  # Per-camera AI prompts. Each entry overrides the global ai_prompt for a specific
  # camera. Cameras not listed here use ai_prompt as the default. The "camera" value
  # must exactly match a camera name as shown in the Blink app (case-sensitive) —
  # this add-on cannot show a dropdown of your camera names here because the HA
  # Supervisor's config form only supports static fields, not live data.
  # Tip: use the Camera Configurations section in the web UI AI tab instead — it
  # lists your actual camera names so there's nothing to type or get wrong.
  # Example: [{camera: "Driveway", prompt: "Focus on vehicle proximity and flag anyone near the car."}]
  ai_camera_prompts: []
  # Per-camera descriptions / context. Each entry tells the AI what the camera is
  # watching so it can give more precise distance estimates and make better decisions.
  # The "camera" value must exactly match a camera name as shown in the Blink app
  # (case-sensitive). These are injected into every prompt for the matching camera
  # and can be edited live in the web UI (AI tab → Camera Configurations) without
  # restarting — that panel lists your actual camera names, so prefer it over
  # typing names here.
  # Example: [{camera: "Driveway", description: "Points at driveway; silver Kia Forte parked left"}]
  ai_camera_descriptions: []
  # Frame extraction strategy controlling how frames are selected and sent to the AI:
  #   "smart"      – (default) extract 2x frames then use motion-diff to pick the
  #                  entry frame, peak-motion frame, and exit frame. Best accuracy.
  #   "sequential" – analyse each frame individually and return the most alarming
  #                  result. Works well when the AI performs better on single images.
  #   "uniform"    – extract exactly ai_max_frames at fixed time intervals (legacy).
  ai_frame_strategy: "smart"
  # Restrict car-proximity rules to specific cameras. When set, only cameras in
  # this list will have the PROTECTED VEHICLE / distance rules injected into
  # their AI prompt. Cameras not in this list will focus on their own camera
  # description instead. Leave empty to apply car rules to all cameras (legacy).
  # Entries must exactly match a camera name as shown in the Blink app
  # (case-sensitive). Tip: use the "Protected vehicle visible from this camera"
  # checkbox in the web UI (AI tab → Camera Configurations) instead — it lists
  # your actual camera names, so there's nothing to type or get wrong.
  # Example: ["Driveway", "Front Door"]
  ai_car_cameras: []
  # Store each clip's exact prompt text (not the image frames) so it can be
  # inspected via the "📝 Prompt" button in the web UI's AI panel — useful
  # for understanding and fine-tuning what's actually being sent. Off by
  # default since prompts are long and this is an opt-in debugging aid.
  ai_prompt_debug_enabled: false

  # --- Computer-vision enhancement pipeline (heavy, optional) ---
  # ⚠ RESOURCE WARNING: both options below require substantially more CPU
  # and RAM than the rest of this add-on, and download large ML models
  # (100MB-800MB+ each, cached under /data after first use). Comfortable on
  # a Raspberry Pi 5 (8GB), a modern NUC/mini-PC, or better; more
  # constrained on an older or lower-RAM Pi. Both are off by default, and
  # clip analysis works exactly as it did before this section existed with
  # both left disabled. See DOCS.md for details.
  #
  # Enhanced frame processing and tracking: frame preprocessing
  # (contrast/denoise), object detection + tracking (YOLO + ByteTrack),
  # monocular depth estimation (Depth Anything V2), and pixel-level contact
  # segmentation (SAM2) — one toggle for all four, since depth/segmentation
  # have always required detection to run at all and there was no real
  # value in enabling them independently. Feeds the AI a precise,
  # code-computed OBJECT DETECTION / TRACKING / DEPTH ESTIMATE / CONTACT
  # ANALYSIS hint instead of relying on motion-diff heuristics alone.
  ai_enhanced_detection_enabled: false
  # Ultralytics model the object-detection stage above runs — one of
  # yolo11n.pt (nano, fastest/lightest, recommended on CPU-only hardware),
  # yolo11s.pt, yolo11m.pt, yolo11l.pt, or yolo11x.pt (extra-large, most
  # accurate, much slower). Downloaded automatically on first use.
  ai_object_detection_model: "yolo11n.pt"
  # Local-only face recognition to suppress alerts for enrolled household
  # members. Enrollment happens entirely on-device via the web UI's AI tab
  # — reference photos and computed face embeddings never leave this add-on
  # or your network, and are never sent to any cloud AI provider.
  ai_face_recognition_enabled: false

  # --- Extended Notifications (AI alerts) ---
  # HA mobile app entity to push AI suspicious-activity alerts to.
  mobile_app_target: ""
  # Enable push notifications to the mobile app for suspicious clips.
  mobile_app_enabled: false
  # SMTP server hostname or IP for email alerts.
  smtp_host: ""
  # SMTP server port (usually 587 for STARTTLS, 465 for SSL).
  smtp_port: 587
  # SMTP login username (usually your email address).
  smtp_user: ""
  # SMTP login password.
  smtp_password: ""
  # List of email addresses to send suspicious-clip alerts to.
  smtp_recipients: []
  # From address used in outgoing alert emails.
  smtp_sender: ""
  # Enable email alerts for suspicious clips.
  smtp_enabled: false
  # Discord webhook URL to post suspicious-clip alerts to.
  discord_webhook_url: ""
  # Enable Discord alerts for suspicious clips.
  discord_enabled: false
  # Create a Home Assistant persistent notification for suspicious clips —
  # independent of notify_ha above, which covers new-clip-downloaded, the
  # daily digest, and system events (2FA/auth/storage) and can be too noisy
  # for someone who only wants an in-HA alert when something's actually
  # flagged suspicious.
  notify_ha_suspicious: false

  # --- Logging ---
  # Log verbosity level. Use "debug" to troubleshoot connection issues.
  log_level: "info"

schema:
  username: "str"
  password: "password"
  download_path: "str"
  organize_by_camera: "bool"
  organize_by_date: "bool"
  filename_format: "str"
  poll_interval: "int(30,3600)"
  max_clips_per_poll: "int(1,500)"
  retention_days: "int(0,365)"
  max_storage_gb: "float(0,1000)"
  camera_filter:
    - "str?"
  motion_only: "bool"
  time_window_start: "str?"
  time_window_end: "str?"
  min_clip_duration: "int(0,3600)"
  download_thumbnails: "bool"
  concurrent_downloads: "int(1,10)"
  retry_attempts: "int(1,10)"
  retry_delay: "float(0,300)"
  notify_ha: "bool"
  ha_notification_title: "str"
  webhook_url: "str?"
  create_clip_manifest: "bool"
  enable_library_db: "bool"
  enable_media_server: "bool"
  media_server_port: "int(1024,65535)"
  watch_ha_events: "bool"
  fast_poll_duration: "int(10,3600)"
  fast_poll_interval: "int(5,60)"
  post_motion_delay: "int(5,300)"
  event_cameras:
    - "str?"
  digest_enabled: "bool"
  digest_time: "str"
  archive_enabled: "bool"
  archive_after_days: "int(1,365)"
  download_local_storage: "bool"
  ai_analysis_enabled: "bool"
  ai_provider: "list(ollama|ollama_cloud|moondream_cloud|moondream_local|anthropic|openai)"
  ollama_url: "str?"
  ollama_model: "str?"
  ollama_cloud_api_key: "password?"
  moondream_api_key: "password?"
  moondream_finetune_model: "str?"
  anthropic_api_key: "password?"
  anthropic_model: "str?"
  openai_api_key: "password?"
  openai_model: "str?"
  ai_escalation_enabled: "bool"
  ai_escalation_provider: "list(ollama|ollama_cloud|moondream_cloud|moondream_local|anthropic|openai)"
  ai_escalation_model: "str?"
  ai_prompt: "str?"
  ai_car_description: "str?"
  ai_max_frames: "int(1,100)"
  ai_frame_interval: "float(0.5,30)"
  ai_suspicious_keywords:
    - "str?"
  ai_schedule_start: "str?"
  ai_schedule_end: "str?"
  ai_batch_size: "int(1,50)"
  ai_check_interval: "int(10,3600)"
  ai_min_confidence: "float(0,1)"
  ai_camera_prompts:
    - camera: "str"
      prompt: "str"
  ai_camera_descriptions:
    - camera: "str"
      description: "str?"
  ai_frame_strategy: "list(smart|sequential|uniform)"
  ai_car_cameras:
    - "str?"
  ai_prompt_debug_enabled: "bool"
  ai_enhanced_detection_enabled: "bool"
  ai_object_detection_model: "list(yolo11n.pt|yolo11s.pt|yolo11m.pt|yolo11l.pt|yolo11x.pt)"
  ai_face_recognition_enabled: "bool"
  mobile_app_target: "str?"
  mobile_app_enabled: "bool"
  smtp_host: "str?"
  smtp_port: "int(25,65535)"
  smtp_user: "str?"
  smtp_password: "password?"
  smtp_recipients:
    - "str?"
  smtp_sender: "str?"
  smtp_enabled: "bool"
  discord_webhook_url: "str?"
  discord_enabled: "bool"
  notify_ha_suspicious: "bool"
  log_level: "list(debug|info|warning|error)"
