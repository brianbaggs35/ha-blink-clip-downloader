---
name: Blink Clip Downloader
version: "v2.8.5"
slug: blink_clip_downloader
image: ghcr.io/brianbaggs35/blink_clip_downloader
description: >-
  Continuously downloads Blink camera clips to local storage with timestamps,
  per-camera organisation, retention policies, storage quotas, HA notifications,
  motion/time-window filtering, SQLite clip library, Video.js web UI, and
  event-driven instant download after motion events.
url: "https://github.com/brianbaggs35/ha-blink-clip-downloader"
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true

# Ingress provides a secure panel entry in the HA sidebar at no extra port.
ingress: true
panel_icon: mdi:cctv
panel_title: Blink Clips

map:
  - type: share
    read_only: false
  - type: data
    read_only: false

# Direct-access port (optional alternative to ingress).
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Clip library web UI (direct access)

options:
  # --- Credentials ---
  username: ""
  password: ""

  # --- Storage ---
  download_path: "/share/blink-clips"
  organize_by_camera: true
  organize_by_date: true
  filename_format: "{camera}_{timestamp}"

  # --- Polling ---
  poll_interval: 300
  max_clips_per_poll: 50

  # --- Retention & quota ---
  retention_days: 30
  max_storage_gb: 10.0

  # --- Filtering ---
  camera_filter: []
  motion_only: false
  time_window_start: ""
  time_window_end: ""
  min_clip_duration: 0

  # --- Download options ---
  download_thumbnails: false
  concurrent_downloads: 3
  retry_attempts: 3
  retry_delay: 5.0

  # --- HA notifications ---
  notify_ha: true
  ha_notification_title: "Blink Clip Downloaded"

  # --- Extra features ---
  webhook_url: ""
  create_clip_manifest: true

  # --- Clip library database ---
  enable_library_db: true

  # --- Media server / web UI ---
  enable_media_server: true
  media_server_port: 8099

  # --- Event-driven instant download ---
  watch_ha_events: true
  fast_poll_duration: 120
  fast_poll_interval: 15
  post_motion_delay: 30
  event_cameras: []

  # --- Daily digest ---
  digest_enabled: true
  digest_time: "08:00"

  # --- ZIP archiving ---
  archive_enabled: false
  archive_after_days: 60

  # --- Sync Module local storage (USB drive clips) ---
  # Requires a USB drive plugged into the Blink Sync Module.
  # Clips transit via the Blink cloud (no direct LAN access).
  download_local_storage: false

  # --- AI Video Analysis ---
  # ai_provider: "ollama"         – Ollama server with a vision model
  #              "moondream_cloud" – Cloud API (needs moondream_api_key)
  #              "moondream_local" – Moondream 0.5B model running on this device
  ai_analysis_enabled: false
  ai_provider: "ollama"
  ollama_url: ""
  ollama_model: ""
  moondream_api_key: ""
  ai_prompt: >-
    Analyze this security camera frame. Describe what you see.
    Is there any suspicious activity? Respond in JSON:
    {"suspicious": true/false, "confidence": 0.0-1.0, "description": "..."}
  ai_car_description: ""
  ai_max_frames: 3
  ai_frame_interval: 2.0
  ai_suspicious_keywords:
    - "suspicious"
    - "break-in"
    - "theft"
    - "vandalism"
    - "intruder"
    - "trespassing"
  ai_schedule_start: ""
  ai_schedule_end: ""
  ai_batch_size: 10
  ai_check_interval: 60

  # --- Extended Notifications (AI alerts) ---
  mobile_app_target: ""
  mobile_app_enabled: false
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  smtp_recipients: []
  smtp_sender: ""
  smtp_enabled: false
  discord_webhook_url: ""
  discord_enabled: false

  # --- Logging ---
  log_level: "info"

schema:
  username: "str"
  password: "password"
  download_path: "str"
  organize_by_camera: "bool"
  organize_by_date: "bool"
  filename_format: "str"
  poll_interval: "int(30,3600)"
  max_clips_per_poll: "int(1,500)"
  retention_days: "int(0,365)"
  max_storage_gb: "float(0,1000)"
  camera_filter:
    - "str?"
  motion_only: "bool"
  time_window_start: "str?"
  time_window_end: "str?"
  min_clip_duration: "int(0,3600)"
  download_thumbnails: "bool"
  concurrent_downloads: "int(1,10)"
  retry_attempts: "int(1,10)"
  retry_delay: "float(0,300)"
  notify_ha: "bool"
  ha_notification_title: "str"
  webhook_url: "str?"
  create_clip_manifest: "bool"
  enable_library_db: "bool"
  enable_media_server: "bool"
  media_server_port: "int(1024,65535)"
  watch_ha_events: "bool"
  fast_poll_duration: "int(10,3600)"
  fast_poll_interval: "int(5,60)"
  post_motion_delay: "int(5,300)"
  event_cameras:
    - "str?"
  digest_enabled: "bool"
  digest_time: "str"
  archive_enabled: "bool"
  archive_after_days: "int(1,365)"
  download_local_storage: "bool"
  ai_analysis_enabled: "bool"
  ai_provider: "list(ollama|ollama_cloud|moondream_cloud|moondream_local)"
  ollama_url: "str?"
  ollama_model: "str?"
  moondream_api_key: "password?"
  ai_prompt: "str?"
  ai_car_description: "str?"
  ai_max_frames: "int(1,10)"
  ai_frame_interval: "float(0.5,30)"
  ai_suspicious_keywords:
    - "str?"
  ai_schedule_start: "str?"
  ai_schedule_end: "str?"
  ai_batch_size: "int(1,50)"
  ai_check_interval: "int(10,3600)"
  mobile_app_target: "str?"
  mobile_app_enabled: "bool"
  smtp_host: "str?"
  smtp_port: "int(25,65535)"
  smtp_user: "str?"
  smtp_password: "password?"
  smtp_recipients:
    - "str?"
  smtp_sender: "str?"
  smtp_enabled: "bool"
  discord_webhook_url: "str?"
  discord_enabled: "bool"
  log_level: "list(debug|info|warning|error)"
