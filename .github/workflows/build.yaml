---
name: Build & Publish

"on":
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: blink_clip_downloader

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Uploading the Trivy SARIF for the published image (see the scan
      # step at the end of this job).
      security-events: write
    outputs:
      version: ${{ steps.tags.outputs.version }}

    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          VERSION="$(grep '^version:' \
            blink_clip_downloader/config.yaml | \
            awk '{print $2}' | tr -d '"')"

          # What actually gets published is VERSION, not the release tag:
          # config.yaml's `image:` key makes Supervisor pull
          # "<image>:<that version>", so the tag has to come from the same
          # field Supervisor reads or the two could drift.
          #
          # Which makes a release cut from the wrong commit dangerous rather
          # than merely wrong. Publishing a "v6.0.0" release off a branch
          # whose config.yaml still says v5.5.2 would rebuild and overwrite
          # :v5.5.2 and :latest, never create :v6.0.0, and report success.
          # Every release so far has had the two in step; if they are not,
          # stop instead of guessing which one was meant.
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [ -n "${RELEASE_TAG}" ] && [ "${RELEASE_TAG}" != "${VERSION}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match" \
              "blink_clip_downloader/config.yaml version ${VERSION}."
            echo "::error::The image is tagged from config.yaml, so this" \
              "run would publish ${VERSION} (and :latest), not" \
              "${RELEASE_TAG}. Re-cut the release from a commit whose" \
              "config.yaml says ${RELEASE_TAG}."
            exit 1
          fi

          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"

          TAG_VER="${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}"
          TAG_VER="${TAG_VER}:${VERSION}-${{ matrix.arch }}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_version=${TAG_VER}" >> "$GITHUB_OUTPUT"

          # Feeds the Dockerfile's APT_CACHE_BUST arg (see its own comment
          # there) — see ci.yaml's identical step for why this exists.
          echo "apt_cache_bust=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: blink_clip_downloader
          file: blink_clip_downloader/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true

          # Provenance attestations (on by default) wrap even a single-arch
          # push in an OCI index, so the per-arch tag pages on ghcr read the
          # (empty) index annotations instead of the Dockerfile's
          # org.opencontainers.image.description label — that's why
          # ":vX.Y.Z-amd64"-style pages showed "No description provided".
          # Nothing consumes the attestations, so disable them and let the
          # label show through.
          provenance: false

          tags: |
            ${{ steps.tags.outputs.tag_version }}

          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.tags.outputs.version }}
            APT_CACHE_BUST=${{ steps.tags.outputs.apt_cache_bust }}

          # PrimeVue's client-side license is intentionally embedded in the
          # generated frontend bundle. BuildKit keeps the input out of build
          # args, logs, image metadata, and intermediate environment layers.
          secrets: |
            primevue_license_key=${{ secrets.PRIMEVUE_LICENSE_KEY }}

          # Keep the architecture-scoped cache for the large runtime layers,
          # but rebuild the secret-dependent frontend stage so a rotated key
          # cannot reuse an old licensed bundle.
          no-cache-filters: frontend-builder
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Scans the exact image that was just published, by its pushed tag —
      # not a rebuild of it. ci.yaml scans this same commit, but not this
      # same artifact: the Dockerfile's APT_CACHE_BUST means a release built
      # on a later day picks up newer Debian packages, and CVEs get
      # published in the gap between a merge and the release cut from it.
      #
      # Report-only, on purpose. The image is already in the registry by
      # this point, so failing here would not unpublish it — it would only
      # skip the manifest job, leaving per-arch tags with no index for
      # Supervisor to pull. The findings land in the Code scanning tab
      # instead, where they are actionable in the next release. Flip
      # exit-code to "1" if a vulnerable release should stop short of
      # publishing its manifest.
      #
      # continue-on-error on both steps: a registry hiccup, a Trivy DB
      # outage or a full runner disk must never be what breaks a release.
      - name: Scan published image for vulnerabilities (Trivy, SARIF)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.tags.outputs.tag_version }}
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          # Without this the SARIF ignores the filter above and carries
          # every severity — see ci.yaml's identical note.
          limit-severities-for-sarif: "true"
          # Fixable only, matching ci.yaml's reporting pass — see the
          # reasoning there. An open alert means there is a patch to pick up.
          ignore-unfixed: true
          format: sarif
          output: trivy-release-${{ matrix.arch }}.sarif
          exit-code: "0"
        env:
          TRIVY_DB_REPOSITORY: >-
            ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2

      - name: Upload Trivy results to code scanning
        continue-on-error: true
        # A category of its own, per architecture: these are results for a
        # published release image, and must not overwrite ci.yaml's results
        # for the same commit (GitHub keys uploads by category).
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-release-${{ matrix.arch }}.sarif
          category: trivy-release-${{ matrix.arch }}

  manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          VERSION="${{ needs.build.outputs.version }}"

          REGISTRY="${{ env.REGISTRY }}"

          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"

          IMAGE="${{ env.IMAGE_NAME }}"

          IMAGE_BASE="${REGISTRY}/${OWNER}/${IMAGE}"

          # ghcr's package page reads the description of a multi-arch image
          # from the manifest *index* annotations, not from the per-arch
          # image config labels — without these, the page shows
          # "No description provided" even though the Dockerfile sets
          # org.opencontainers.image.description.
          DESC="Home Assistant add-on for saving and viewing Blink camera clips,"
          DESC="${DESC} with AI analysis and facial recognition"
          SRC="https://github.com/${{ github.repository }}"

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=${DESC}" \
            --annotation "index:org.opencontainers.image.source=${SRC}" \
            -t "${IMAGE_BASE}:${VERSION}" \
            "${IMAGE_BASE}:${VERSION}-amd64" \
            "${IMAGE_BASE}:${VERSION}-aarch64"

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=${DESC}" \
            --annotation "index:org.opencontainers.image.source=${SRC}" \
            -t "${IMAGE_BASE}:latest" \
            "${IMAGE_BASE}:${VERSION}-amd64" \
            "${IMAGE_BASE}:${VERSION}-aarch64"
