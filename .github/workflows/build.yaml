---
name: Build & Publish

"on":
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: blink_clip_downloader

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.tags.outputs.version }}

    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          VERSION=$(grep '^version:' \
            blink_clip_downloader/config.yaml | \
            awk '{print $2}' | tr -d '"')

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          TAG_VER="${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}"
          TAG_VER="${TAG_VER}:${VERSION}-${{ matrix.arch }}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_version=${TAG_VER}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: blink_clip_downloader
          file: blink_clip_downloader/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true

          # Provenance attestations (on by default) wrap even a single-arch
          # push in an OCI index, so the per-arch tag pages on ghcr read the
          # (empty) index annotations instead of the Dockerfile's
          # org.opencontainers.image.description label — that's why
          # ":vX.Y.Z-amd64"-style pages showed "No description provided".
          # Nothing consumes the attestations, so disable them and let the
          # label show through.
          provenance: false

          tags: |
            ${{ steps.tags.outputs.tag_version }}

          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.tags.outputs.version }}

          # GitHub Actions BuildKit cache — scoped per architecture since
          # both matrix legs run in parallel and would otherwise share the
          # same default scope, letting one job's cache-to contend with
          # (and undermine) the other's, which defeats the point for the
          # slow, emulated aarch64 leg specifically.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          VERSION=${{ needs.build.outputs.version }}

          REGISTRY=${{ env.REGISTRY }}

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          IMAGE=${{ env.IMAGE_NAME }}

          IMAGE_BASE="${REGISTRY}/${OWNER}/${IMAGE}"

          # ghcr's package page reads the description of a multi-arch image
          # from the manifest *index* annotations, not from the per-arch
          # image config labels — without these, the page shows
          # "No description provided" even though the Dockerfile sets
          # org.opencontainers.image.description.
          DESC="Home Assistant add-on for saving and viewing Blink camera clips,"
          DESC="${DESC} with AI analysis and facial recognition"
          SRC="https://github.com/${{ github.repository }}"

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=${DESC}" \
            --annotation "index:org.opencontainers.image.source=${SRC}" \
            -t ${IMAGE_BASE}:${VERSION} \
            ${IMAGE_BASE}:${VERSION}-amd64 \
            ${IMAGE_BASE}:${VERSION}-aarch64

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=${DESC}" \
            --annotation "index:org.opencontainers.image.source=${SRC}" \
            -t ${IMAGE_BASE}:latest \
            ${IMAGE_BASE}:${VERSION}-amd64 \
            ${IMAGE_BASE}:${VERSION}-aarch64
