---
name: Build & Publish

"on":
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: blink_clip_downloader

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.tags.outputs.version }}

    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          VERSION=$(grep '^version:' \
            blink_clip_downloader/config.yaml | \
            awk '{print $2}' | tr -d '"')

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          TAG_VER="${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}"
          TAG_VER="${TAG_VER}:${VERSION}-${{ matrix.arch }}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_version=${TAG_VER}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: blink_clip_downloader
          file: blink_clip_downloader/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true

          tags: |
            ${{ steps.tags.outputs.tag_version }}

          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.tags.outputs.version }}

          # GitHub Actions BuildKit cache — scoped per architecture since
          # both matrix legs run in parallel and would otherwise share the
          # same default scope, letting one job's cache-to contend with
          # (and undermine) the other's, which defeats the point for the
          # slow, emulated aarch64 leg specifically.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          VERSION=${{ needs.build.outputs.version }}

          REGISTRY=${{ env.REGISTRY }}

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          IMAGE=${{ env.IMAGE_NAME }}

          IMAGE_BASE="${REGISTRY}/${OWNER}/${IMAGE}"

          docker buildx imagetools create \
            -t ${IMAGE_BASE}:${VERSION} \
            ${IMAGE_BASE}:${VERSION}-amd64 \
            ${IMAGE_BASE}:${VERSION}-aarch64

          docker buildx imagetools create \
            -t ${IMAGE_BASE}:latest \
            ${IMAGE_BASE}:${VERSION}-amd64 \
            ${IMAGE_BASE}:${VERSION}-aarch64
