---
name: Build & Publish

"on":
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: blink_clip_downloader

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.tags.outputs.version }}

    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]
        include:
          - arch: aarch64
            base_image: >
              ghcr.io/home-assistant/aarch64-base-debian:trixie
            platform: linux/arm64
          - arch: amd64
            base_image: >
              ghcr.io/home-assistant/amd64-base-debian:trixie
            platform: linux/amd64

    steps:
      - uses: actions/checkout@v6

      - name: Read add-on version
        id: version
        run: |
          VERSION=$(grep '^version:' blink_clip_downloader/config.yaml \
            | awk '{print $2}' \
            | tr -d '"')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          VERSION=$(grep '^version:' \
            blink_clip_downloader/config.yaml | \
            awk '{print $2}' | tr -d '"')
          OWNER=${{ github.repository_owner }}
          TAG_VER="ghcr.io/${OWNER}/blink_clip_downloader"
          TAG_VER="${TAG_VER}:${VERSION}-${{ matrix.arch }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_version=${TAG_VER}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: blink_clip_downloader
          file: blink_clip_downloader/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ steps.tags.outputs.tag_version }}
          build-args: |
            BUILD_FROM=${{ matrix.base_image }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.tags.outputs.version }}

  manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          VERSION=${{ needs.build.outputs.version }}
          REGISTRY=${{ env.REGISTRY }}
          OWNER=${{ github.repository_owner }}
          IMAGE=${{ env.IMAGE_NAME }}
          IMAGE_BASE="${REGISTRY}/${OWNER}/${IMAGE}"

          # Create versioned manifest (combining amd64 and aarch64)
          docker buildx imagetools create \
            -t ${IMAGE_BASE}:${VERSION} \
            ${IMAGE_BASE}:${VERSION}-amd64 \
            ${IMAGE_BASE}:${VERSION}-aarch64

          # Create latest manifest pointing to current version
          docker buildx imagetools create \
            -t ${IMAGE_BASE}:latest \
            ${IMAGE_BASE}:${VERSION}-amd64 \
            ${IMAGE_BASE}:${VERSION}-aarch64
