---
name: HA Supervisor Integration Test

# Deliberately separate from ci.yaml: this exercises real Home Assistant
# Supervisor + Core (not just a bare `docker run` of the built image), so
# it's much slower and depends on infrastructure this repo doesn't control
# (see the two known upstream issues linked below) - informational only for
# now, not a required/blocking check. It does not touch ci.yaml, its
# existing Docker smoke-test job, or any branch protection settings.
#
# What ci.yaml's build/smoke-test jobs cannot catch, and this job exists
# specifically to catch: whether Home Assistant Supervisor can actually
# discover this add-on as a local app, pull the licensed image through
# Supervisor, install and start it,
# register its ingress panel in the HA sidebar, and serve real content
# through that real ingress proxy - the actual app<->Home Assistant
# integration boundary, not just "the container runs."
#
# Known upstream risk factors this job is built to tolerate, not eliminate
# (see scripts/ci/ha_integration_setup.sh for the specific mitigations):
# https://github.com/home-assistant/supervisor/issues/3976 (local add-on
# discovery, closed "not planned") and
# https://github.com/home-assistant/supervisor/issues/5991 (a build
# regression tied to Supervisor's beta channel - this job pins `stable`).
#
# Explicit scope reduction, and why: this job disables AppArmor confinement
# for the add-on copy it installs (see "Prepare CI-only add-on copy"
# below) - AppArmor policy correctness is NOT exercised here. Real
# confinement under this exact profile made the add-on's own s6-overlay
# services fail entirely (s6-ipcserver-socketbinder: Permission denied)
# inside this nested Docker-in-Docker environment, and a fix modelled
# directly on Supervisor's own reference apparmor.txt (matching rule,
# matching rationale) did not resolve it on a real run - see git history
# on blink_clip_downloader/apparmor.txt around 2026-09-08 for the
# investigation. That strongly suggests this CI environment's AppArmor
# enforcement doesn't faithfully reproduce a real Home Assistant OS host,
# not that the add-on's profile is actually broken (it is unchanged from
# the last state confirmed working on real HAOS installs). Chasing that
# gap further wasn't worth blocking this job's actual purpose - Supervisor
# discovery/build/install/start and real ingress - on an environment
# difference outside this repo's control.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ha-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ghcr.io/home-assistant/devcontainer:6-apps, pinned by digest so an
  # unrelated upstream image update can't silently change this job's
  # behavior between runs.
  #
  # Upgrading the HA test environment (do this deliberately, not
  # accidentally): resolve the new digest for the tag below, update
  # DEVCONTAINER_IMAGE, then validate locally with
  # `scripts/run-act-ha-integration.sh` before merging the bump.
  #   docker pull ghcr.io/home-assistant/devcontainer:6-apps
  #   docker inspect ghcr.io/home-assistant/devcontainer:6-apps \
  #     --format '{{index .RepoDigests 0}}'
  DEVCONTAINER_IMAGE: >-
    ghcr.io/home-assistant/devcontainer@sha256:91cfc04eaf96b4844b397418781413e2dc4dd8b6f0d6669bb754fa8497b289fc
  CONTAINER_NAME: ha-integration-test
  ADDON_SLUG: local_blink_clip_downloader
  # Must match blink_clip_downloader/config.yaml's panel_title exactly -
  # it's what a real user (and this job's Playwright check) actually
  # clicks in the HA sidebar.
  ADDON_PANEL_TITLE: Blink Clips
  # Must match blink_clip_downloader/config.yaml's name field exactly -
  # what a real user sees in Settings > Apps and on the add-on's own
  # info/log pages (a different HA surface than the sidebar ingress
  # panel above, hence the separate value).
  ADDON_NAME: Blink Clip Downloader
  # HA is reached via hassio_observer, Supervisor's stable entry point
  # (container port 80) - NOT Core's own 8123, which redirects direct
  # access there once it detects it's running under Supervisor (confirmed
  # empirically; see ha_integration_setup.sh's cmd_wait_core). Mapped to
  # host 8123 purely for the familiar number.
  HA_PORT: "8123"
  # The add-on's own direct-access port (config.yaml's ports: 8099/tcp) -
  # used only as a secondary startup-readiness probe. Never used to prove
  # ingress works; see e2e/ha_integration_smoke.mjs's assertRealIngress().
  ADDON_PORT: "8099"
  # Deliberately under github.workspace, NOT runner.temp - see the
  # "Prepare CI-only add-on copy" step's comment for why runner.temp
  # cannot be validated locally via act, even though it would work fine
  # on a real runner.
  ADDON_COPY_DIR: ${{ github.workspace }}/.ha-integration-addon-copy

jobs:
  ha-integration-test:
    name: HA Supervisor Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    # Fork pull requests cannot receive the PrimeVue license, so they cannot
    # build the image Supervisor has to pull.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set integration image
        id: integration-image
        run: |
          # Supervisor appends config.yaml's version to the image repository
          # itself; the image field must not contain a tag.
          #
          # 127.0.0.1:5000 is a registry this job starts *inside* the
          # devcontainer (see serve-local-image) — the image never leaves
          # the job. prepare-addon-copy rewrites the add-on copy's
          # `version:` to match this tag, so Supervisor asks for exactly
          # what was pushed there.
          VERSION="0.0.0-${GITHUB_SHA::12}"
          {
            echo "image=127.0.0.1:5000/blink_clip_downloader-ha-integration"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Supervisor's nested Docker build does not expose a way to forward
      # BuildKit secrets, so it cannot build this image itself — the
      # PrimeVue license would be missing and the build would fail. Build it
      # on the runner, where the secret is available, and make the CI-only
      # add-on copy reference it so Supervisor pulls rather than builds.
      - name: Build the licensed integration image
        uses: docker/build-push-action@v7
        with:
          context: blink_clip_downloader
          file: blink_clip_downloader/Dockerfile
          platforms: linux/amd64
          # Into the runner's own daemon, not a registry: serve-local-image
          # hands it to the devcontainer directly further down.
          push: false
          load: true
          provenance: false
          tags: ${{ steps.integration-image.outputs.image }}:${{ steps.integration-image.outputs.version }}
          build-args: |
            BUILD_ARCH=amd64
            BUILD_VERSION=${{ steps.integration-image.outputs.version }}
          secrets: |
            primevue_license_key=${{ secrets.PRIMEVUE_LICENSE_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Update npm
        run: npm install -g npm@12.0.2

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Copies blink_clip_downloader/ to ADDON_COPY_DIR (github.workspace,
      # not runner.temp - see below) and sets `apparmor: false` in that
      # copy's config.yaml only - the real repo files (what a real user's
      # install actually gets) are never written to. See the
      # scope-reduction note in this file's header comment for why this
      # exists at all.
      #
      # Why github.workspace, specifically, and not runner.temp: the next
      # step's `docker run` creates a *sibling* container talking directly
      # to the runner's own Docker daemon, so its host-side bind-mount
      # path is resolved against the actual runner machine's filesystem,
      # not this step's own shell. On a real GitHub-hosted runner that's
      # not a distinction that matters - the runner process, the step's
      # shell, and the Docker daemon are all the same one machine. Under
      # `act`, though, each step runs inside act's own job container, and
      # by default that container gets a one-time `docker cp` *snapshot*
      # of the repo at checkout, not a live view of it - so ANY path
      # created fresh during a step, github.workspace-relative or not,
      # would normally only exist inside that ephemeral snapshot,
      # invisible to the *host's* real Docker daemon the sibling container
      # talks to. Docker doesn't error on a missing bind-mount source; it
      # silently creates an empty directory there instead, which is
      # exactly what happened here on 2026-09-08 (confirmed via the
      # phantom empty directory left behind on the real host: first tried
      # runner.temp, then github.workspace, both came up empty under
      # act's default copy semantics). The actual fix is
      # scripts/run-act-ha-integration.sh passing act's `--bind` flag,
      # which makes the whole working directory a live two-way mount
      # instead of a one-time copy - github.workspace matters because
      # --bind only covers the working directory specifically, not
      # runner.temp or any other path. This is also exactly why this
      # exists as its own copy step instead of writing `apparmor: false`
      # into the real checked-out blink_clip_downloader/ directly - with
      # --bind making the workspace a live mount, writing there for real
      # would mutate the actual repo checkout, so the copy step (and this
      # directory being gitignored) is what keeps that from happening.
      - name: Prepare CI-only add-on copy (AppArmor disabled)
        run: scripts/ci/ha_integration_setup.sh prepare-addon-copy
        env:
          INTEGRATION_IMAGE: ${{ steps.integration-image.outputs.image }}
          INTEGRATION_VERSION: ${{ steps.integration-image.outputs.version }}

      # Real nested Docker-in-Docker (this container runs its own dockerd
      # against the volumes below, not a socket-passthrough to the
      # runner's daemon) - --privileged is required for that, same as the
      # official devcontainer's own .devcontainer.json specifies.
      - name: Start Home Assistant devcontainer (Supervisor + Core)
        run: |
          docker run -d --name "$CONTAINER_NAME" --privileged \
            -e SUPERVISOR_CHANNEL=stable \
            -e WORKSPACE_DIRECTORY=/mnt/supervisor/apps/local/blink_clip_downloader \
            -p "${HA_PORT}:80" \
            -p "${ADDON_PORT}:${ADDON_PORT}" \
            -v /var/lib/docker \
            -v /var/lib/containerd \
            -v /mnt/supervisor \
            --tmpfs /tmp \
            -v "${ADDON_COPY_DIR}:/mnt/supervisor/apps/local/blink_clip_downloader" \
            "$DEVCONTAINER_IMAGE"

      - name: Bootstrap devcontainer
        run: docker exec -u vscode "$CONTAINER_NAME" bash devcontainer_bootstrap

      # The outer container's own init system starts an inner dockerd as
      # one of its managed services - not necessarily ready the instant
      # `docker run -d` above returns. supervisor_run (next step) has
      # `set -e` and dies silently and immediately if it can't reach that
      # daemon yet, with nothing surfacing the failure until the full
      # Core-readiness wait times out - confirmed as a real failure on a
      # real runner, not just a theoretical race. Waiting for it
      # explicitly here, before supervisor_run ever runs, is the fix.
      - name: Wait for inner Docker daemon
        run: scripts/ci/ha_integration_setup.sh wait-docker

      - name: Start Supervisor
        run: |
          docker exec -d "$CONTAINER_NAME" \
            bash -c "supervisor_run > /var/log/supervisor_run.log 2>&1"

      - name: Wait for Home Assistant Core
        run: scripts/ci/ha_integration_setup.sh wait-core

      # Hands the licensed image to the devcontainer's own daemon and
      # serves it from a loopback registry in there, so Supervisor can pull
      # it without anything being published to a real registry. Supervisor
      # still pulls Home Assistant's own images from ghcr anonymously, as
      # any local devcontainer run does.
      #
      # Must come *after* Supervisor is up, not before: `supervisor_run`
      # stops and removes every container on the inner daemon as one of its
      # first actions ("Stopping and removing containers..." in
      # supervisor_run.log). Started any earlier, the registry is wiped
      # before Supervisor ever tries to pull, and the only symptom is a
      # "connection refused" buried in the Supervisor log.
      - name: Serve the licensed image inside the devcontainer
        env:
          INTEGRATION_IMAGE: ${{ steps.integration-image.outputs.image }}
          INTEGRATION_VERSION: ${{ steps.integration-image.outputs.version }}
        run: |
          # registry:2 travels in the same tar rather than being pulled
          # inside the devcontainer: that pull would be an anonymous Docker
          # Hub request from a shared runner IP, which is exactly the kind
          # of rate-limited dependency that turns a green job red for
          # reasons having nothing to do with this repo.
          docker pull registry:2
          docker save \
            "${{ steps.integration-image.outputs.image }}:${{ steps.integration-image.outputs.version }}" \
            registry:2 \
            -o "${RUNNER_TEMP}/integration-image.tar"
          scripts/ci/ha_integration_setup.sh serve-local-image \
            "${RUNNER_TEMP}/integration-image.tar"

      - name: Discover the add-on as a local app
        run: scripts/ci/ha_integration_setup.sh discover

      - name: Install the add-on through Supervisor
        run: scripts/ci/ha_integration_setup.sh install

      # Reclaim disk before Playwright/the browser do any more work of
      # their own - Supervisor's own image set plus this add-on's build
      # (Debian + bundled PostgreSQL 17 + a full npm frontend build)
      # together leave meaningfully less headroom than a typical job in
      # this repo's other CI workflows.
      - name: Prune build cache
        run: docker exec "$CONTAINER_NAME" docker builder prune -f

      - name: Start the add-on
        run: scripts/ci/ha_integration_setup.sh start

      - name: Enable the add-on's ingress panel
        run: scripts/ci/ha_integration_setup.sh enable-ingress-panel

      - name: Verify Supervisor is running the version we just built
        run: >-
          scripts/ci/ha_integration_setup.sh assert-version
          "${{ steps.integration-image.outputs.version }}"

      # config.yaml's declarations are promises only a real Supervisor
      # reads. Dropping `ingress: true` or `homeassistant_api: true` still
      # builds, still starts, and still passes the bare docker-run smoke
      # test — it fails only here.
      - name: Verify Supervisor granted the capabilities config.yaml asks for
        run: scripts/ci/ha_integration_setup.sh assert-capabilities

      # The option schema is what stands between a user's typo and an
      # add-on that crashes on boot. Supervisor is the only thing that ever
      # enforces it — pytest builds AppConfig from a dict it wrote itself
      # and never sees the schema at all, so an over-permissive or
      # malformed schema would ship silently.
      - name: Verify Supervisor enforces the add-on's option schema
        run: >-
          scripts/ci/ha_integration_setup.sh assert-option-rejected
          retention_days 999

      - name: Verify through Home Assistant (onboarding, login, ingress, HA API, logs)
        working-directory: e2e
        run: >-
          node ha_integration_smoke.mjs
          "http://127.0.0.1:${HA_PORT}" "$ADDON_SLUG" "$ADDON_PANEL_TITLE" "$ADDON_NAME"

      # Deliberately *after* the sweep above, which verifies every tab in
      # its empty state — that is a real condition worth holding onto, and
      # a fresh install is exactly it. What it cannot tell you is whether
      # the same tabs render a real list, which is every other install.
      # Rows go straight into the add-on's bundled PostgreSQL because no
      # API creates clips — they only arrive from Blink — the same approach
      # frontend/e2e/ takes for security_events.
      - name: Seed clips and analysis results into the add-on's database
        run: scripts/ci/ha_integration_setup.sh seed-data

      - name: Verify the seeded library renders through ingress
        working-directory: e2e
        run: >-
          node ha_integration_seeded.mjs
          "http://127.0.0.1:${HA_PORT}" "$ADDON_SLUG" "$ADDON_PANEL_TITLE"

      # Changed *before* the restart below, so one restart rehearses two
      # things at once. This is the Supervisor->add-on configuration
      # contract — the Configuration tab writes /data/options.json and
      # AppConfig has to parse it — which nothing else in CI covers:
      # pytest reads an options.json it wrote itself, and every other job
      # here runs the add-on on defaults.
      - name: Change an add-on option through Supervisor
        run: scripts/ci/ha_integration_setup.sh set-option retention_days 17

      # The smoke step above wrote a setting through the real ingress UI.
      # Restarting recreates the add-on's container while /data survives —
      # the same transition an *update* puts an existing install through —
      # so reading that setting back afterwards is this job's proof that an
      # upgrade does not lose an existing user's data. Every other suite in
      # this repo only ever exercises a first-ever start against an empty
      # volume.
      - name: Restart the add-on (container recreated, /data kept)
        run: scripts/ci/ha_integration_setup.sh restart

      - name: Verify settings written before the restart survived it
        run: >-
          scripts/ci/ha_integration_setup.sh assert-persisted
          "ha-integration-marker.apps.googleusercontent.com"

      # The database half of the same restart, and the part that actually
      # loses people their library. assert-persisted above re-reads a JSON
      # file, which shows the /data volume came back; this reads rows back
      # out of the bundled PostgreSQL cluster through the app, which shows
      # the cluster re-attached it. A cluster quietly re-initialized from
      # scratch comes up healthy on an empty database and passes every
      # other check here.
      - name: Verify the seeded clips survived the restart
        run: scripts/ci/ha_integration_setup.sh assert-seed-survived

      # The other half of the restart: the add-on logs its resolved
      # configuration at startup, so the new value appearing there is
      # end-to-end evidence that Supervisor's stored option reached
      # AppConfig — not merely that Supervisor persisted it.
      - name: Verify the changed option reached the running app
        run: >-
          scripts/ci/ha_integration_setup.sh assert-log-contains
          "Retention[[:space:]]+: 17 days"
          "the retention option set through Supervisor"

      # A traceback in the poll loop, the media server or any background task
      # does not stop the container, so without this the job passes green with
      # the add-on quietly broken behind a UI that still renders empty states.
      - name: Check the add-on's log for unexpected errors
        run: scripts/ci/ha_integration_setup.sh assert-clean-log

      - name: Collect diagnostics
        if: failure()
        run: |
          scripts/ci/ha_integration_setup.sh diagnostics ha-integration-diagnostics || true

      - name: Upload diagnostics
        if: ${{ !env.ACT && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ha-integration-diagnostics
          path: |
            ha-integration-diagnostics
            e2e/ha-integration-failure-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop and remove the devcontainer
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true
