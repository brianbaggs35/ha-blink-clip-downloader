---
name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Built and loaded locally within this same workflow run only (never
  # pushed to a registry) — a fixed lowercase name avoids "repository name
  # must be lowercase" failures when github.repository_owner has uppercase
  # characters (Docker/OCI image names must be all-lowercase).
  ADDON_IMAGE: test-blink-clip-downloader
  TAG: ${{ github.sha }}

jobs:
  lint:
    name: Lint & Quality Checks
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      PYTHON_VERSION: ${{ matrix.python-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "blink_clip_downloader[test]"
          pip install pyright yamllint ruff

      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: blink_clip_downloader
          community: false

      - name: Run YAML lint
        run: yamllint .

      - name: Run Ruff
        run: ruff check blink_clip_downloader

      - name: Check formatting with Ruff
        run: ruff format --check blink_clip_downloader

      - name: Run Pyright
        run: pyright --project pyrightconfig.json

      # Frontend checks don't depend on the Python matrix leg, so they only
      # need to run once — pinned to the 3.12 leg to avoid running twice.
      - name: Set up Node.js
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: blink_clip_downloader/frontend/package-lock.json

      - name: Install frontend dependencies
        if: matrix.python-version == '3.12'
        working-directory: blink_clip_downloader/frontend
        run: npm ci

      - name: Run ESLint
        if: matrix.python-version == '3.12'
        working-directory: blink_clip_downloader/frontend
        run: npm run lint

      - name: Check frontend formatting with Prettier
        if: matrix.python-version == '3.12'
        working-directory: blink_clip_downloader/frontend
        run: npm run format:check

      - name: Run Vue/TypeScript type checks
        if: matrix.python-version == '3.12'
        working-directory: blink_clip_downloader/frontend
        run: npm run type-check

  test:
    name: Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      PYTHON_VERSION: ${{ matrix.python-version }}

    # Matches the Postgres major version bundled in the add-on's own image
    # (see Dockerfile) — tests/conftest.py's `db` fixture connects to this
    # via TEST_DATABASE_DSN, defaulting to
    # postgresql://postgres:postgres@localhost:5432/blink_clips_test, which
    # is exactly what this service exposes, so no DSN override is needed.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blink_clips_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "blink_clip_downloader[test]"

      - name: Run pytest with coverage
        working-directory: blink_clip_downloader
        run: |
          pytest tests \
            -v \
            --tb=short \
            --cov=blink_downloader \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:../coverage.xml

      - name: Upload coverage artifact
        # actions/upload-artifact@v4+ uses the GitHub Actions Results
        # service, which `act` can't emulate (it fakes the runtime token,
        # causing "Invalid token specified: missing part #2"). `act` sets
        # ACT=true for every job, so skip this step there — the artifact
        # isn't needed for a local `act` run anyway.
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      # Frontend tests don't depend on the Python matrix leg, so they only
      # need to run once — pinned to the 3.12 leg to avoid running twice.
      - name: Set up Node.js
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: blink_clip_downloader/frontend/package-lock.json

      - name: Install frontend dependencies
        if: matrix.python-version == '3.12'
        working-directory: blink_clip_downloader/frontend
        run: npm ci

      - name: Run Vitest with coverage
        if: matrix.python-version == '3.12'
        working-directory: blink_clip_downloader/frontend
        run: npm run test:coverage

  build:
    name: Build Add-on Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    # Both legs build *natively* on a runner of the matching architecture —
    # GitHub's arm64-hosted runners (free for public repos as of 2025) make
    # this possible without QEMU cross-emulation, which is both faster and a
    # more faithful test than an emulated build: it exercises this add-on's
    # actual dependency resolution (see the Dockerfile's computer-vision
    # pipeline block) exactly as it would run on real hardware — most
    # relevantly a Raspberry Pi 5, since that's this project's aarch64
    # reference target. The Dockerfile's own FROM is a single multi-platform
    # manifest tag (see its top-of-file comment), so no per-arch base image
    # needs to be threaded through here — only BUILD_ARCH.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build add-on image (local Docker)
        run: |
          docker build \
            --pull \
            --build-arg BUILD_ARCH=${{ matrix.arch }} \
            -t ${{ env.ADDON_IMAGE }}:${{ env.TAG }} \
            blink_clip_downloader

      - name: Save built Docker image
        run: |
          docker save \
            ${{ env.ADDON_IMAGE }}:${{ env.TAG }} \
            -o addon-image.tar

      - name: Upload image artifact
        # Skipped under `act` — see the coverage-artifact step above for why.
        # `act` runs jobs against the host's Docker daemon, so the image
        # `build` just created is already visible to `smoke-test` without
        # needing to round-trip through the artifact service. (`act` also
        # has no equivalent of GitHub's hosted arm64 runners, so only the
        # amd64 leg is meaningful to run locally under it.)
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: addon-image-${{ matrix.arch }}
          path: addon-image.tar

  smoke-test:
    name: Smoke Test Add-on Container (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build

    # Matches the build job's matrix so each image runs on a real host of
    # its own architecture — no QEMU involved for either building or
    # running, so this catches native-only failures (like the
    # illegal-instruction-on-incompatible-CPU class of PyTorch bug the
    # computer-vision pipeline now guards against at runtime — see
    # vision.py's torch_cpu_compatible()) that an emulated smoke test could
    # miss entirely.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Download built image artifact
        # Skipped under `act` — see the `build` job's upload step for why.
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: addon-image-${{ matrix.arch }}

      - name: Load Docker image
        # Under `act`, the `build` job already loaded this image into the
        # shared host Docker daemon, so there's no tarball to load here.
        if: ${{ !env.ACT }}
        run: docker load -i addon-image.tar

      - name: Create smoke-test data directories
        run: |
          mkdir -p smoke-test/data smoke-test/share
          cat > smoke-test/data/options.json <<'EOF'
          {
            "username": "test@example.com",
            "password": "test-password",
            "download_path": "/share/blink-clips",
            "poll_interval": 300,
            "max_clips_per_poll": 1,
            "retention_days": 1,
            "max_storage_gb": 1.0,
            "camera_filter": [],
            "download_thumbnails": false,
            "concurrent_downloads": 1,
            "retry_attempts": 1,
            "retry_delay": 1.0,
            "notify_ha": false,
            "create_clip_manifest": false,
            "enable_library_db": true,
            "enable_media_server": true,
            "watch_ha_events": false,
            "fast_poll_duration": 120,
            "fast_poll_interval": 15,
            "post_motion_delay": 30,
            "event_cameras": [],
            "digest_enabled": false,
            "archive_enabled": false,
            "log_level": "info"
          }
          EOF

      - name: Run container
        run: |
          docker run -d --name addon \
            -e TZ=UTC \
            -p 8099:8099 \
            -v "${{ github.workspace }}/smoke-test/data:/data" \
            -v "${{ github.workspace }}/smoke-test/share:/share" \
            ${{ env.ADDON_IMAGE }}:${{ env.TAG }}

      - name: Wait for startup
        run: sleep 15

      - name: Validate container health
        run: |
          if ! docker ps \
            --filter "name=addon" \
            --filter "status=running" \
            | grep addon; then
            docker logs addon
            exit 1
          fi

          docker logs addon

      - name: Verify media server responds
        run: |
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8099/health; then
              echo "Media server is up"
              exit 0
            fi
            echo "Media server not reachable yet (attempt $i/10), retrying..."
            sleep 3
          done
          echo "Media server never became reachable on port 8099"
          docker logs addon
          exit 1

      - name: Smoke test media server endpoints
        run: |
          echo "GET / (web UI shell)"
          index_body=$(curl -fsS http://localhost:8099/)
          grep -q "<title>Blink Clip Downloader</title>" <<<"$index_body"

          echo "GET /api/clips"
          curl -fsS http://localhost:8099/api/clips | jq -e 'type == "array"' >/dev/null

          echo "GET /api/stats"
          curl -fsS http://localhost:8099/api/stats | jq -e 'has("total_count")' >/dev/null

          echo "GET /api/cameras"
          curl -fsS http://localhost:8099/api/cameras | jq -e 'type == "array"' >/dev/null

          echo "GET /api/auth/status"
          curl -fsS http://localhost:8099/api/auth/status | jq -e 'has("state")' >/dev/null

          echo "GET /api/ai/faces (local-only face-recognition enrollment)"
          curl -fsS http://localhost:8099/api/ai/faces | jq -e 'has("faces")' >/dev/null

          echo "GET /api/vehicle/settings (Vehicles tab)"
          curl -fsS http://localhost:8099/api/vehicle/settings | jq -e 'has("car_description")' >/dev/null

          echo "GET /api/ai/camera-configs (Vehicles/AI tab camera config)"
          curl -fsS http://localhost:8099/api/ai/camera-configs | jq -e 'type == "array"' >/dev/null

          echo "All media server endpoints responded as expected"

      - name: Playwright e2e smoke check
        working-directory: e2e
        run: node smoke.mjs http://localhost:8099/

      - name: Verify container is still healthy after smoke tests
        run: |
          if ! docker ps \
            --filter "name=addon" \
            --filter "status=running" \
            | grep addon; then
            echo "Container is no longer running after smoke tests"
            docker logs addon
            exit 1
          fi

          if docker logs addon 2>&1 | grep -q "Traceback (most recent call last)"; then
            echo "Found an unhandled exception in container logs:"
            docker logs addon
            exit 1
          fi

          echo "Container still running with no unhandled exceptions"

      - name: Dump container logs on failure
        if: failure()
        run: docker logs addon || true

      - name: Cleanup
        if: always()
        run: docker rm -f addon || true

  supervisor-install-test:
    name: Install Add-on via Real HA Supervisor
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Independent of build/smoke-test above (no `needs:`) and not gated on
    # their artifact — config.yaml has no `image:` field, so a real HAOS
    # install always builds this add-on locally and natively rather than
    # pulling a pre-built image (see CLAUDE.md), and this job mirrors that
    # exactly: real HA Supervisor discovers, builds, and installs the
    # add-on from source, the same way this whole project has been
    # manually verified throughout development. This exists specifically
    # to catch problems the smoke-test job's bare `docker run` structurally
    # cannot see, since it never goes through Supervisor at all — config.yaml
    # schema validation, AppArmor profile registration, and the generated
    # Configuration tab. That gap is not hypothetical: an optional-select
    # schema quirk once made a Configuration field permanently unreachable
    # in the real Supervisor UI while every container-level check still
    # passed clean.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Disable AppArmor (real GitHub-hosted runners only)
        # GitHub's Ubuntu runner images ship with AppArmor active, unlike
        # the WSL2/plain-Linux Docker hosts this job was developed and
        # locally verified against via `act` (which sets ACT=true — see
        # the other !env.ACT steps in this file — and never exercises real
        # AppArmor enforcement at all, since it isn't active on that host
        # either). Confirmed via a real failed run's dumped Supervisor log:
        # `hassio_supervisor` itself was stuck in a permanent retry loop on
        # `s6-ipcserver-socketbinder: fatal: unable to create socket:
        # Permission denied` — an internal control socket this doubly
        # nested container (GitHub runner -> this job's own --privileged
        # ha-supervisor-ci -> hassio_supervisor) needs, blocked because
        # --privileged on the *outer* container doesn't make the *inner*
        # dockerd's own default container security profile unconfined too.
        # This exact failure mode for nested/privileged containers on
        # GitHub-hosted runners is acknowledged upstream (actions/
        # runner-images#10015: "apparmor should be disabled by default on
        # Ubuntu" — these are ephemeral, single-job VMs with full root
        # access already, so AppArmor has no real security benefit here,
        # only the cost of exactly this kind of hard-to-debug breakage).
        # `aa-teardown` unloads every currently-loaded profile immediately,
        # no service restart/reboot needed, which fits a single CI job;
        # falls back to stopping the systemd unit if that command isn't
        # present on a future runner image, and either way this step must
        # never fail the job — losing AppArmor confinement one way or the
        # other is the goal, not a hard requirement to proceed.
        if: ${{ !env.ACT }}
        run: |
          sudo aa-teardown 2>/dev/null \
            || sudo systemctl stop apparmor 2>/dev/null \
            || true

      - name: Start Home Assistant Supervisor devcontainer
        run: |
          # Volume names are prefixed ci- and container removal is forced
          # up front deliberately: a GitHub-hosted runner is a fresh VM
          # every run so this never matters there, but this job is also
          # run locally via `act` (this repo's established way to test
          # workflow changes without pushing — see ci.yaml's other !env.ACT
          # checks), on the same Docker host as any long-lived local dev
          # environment such as a manually-run Supervisor devcontainer.
          # An earlier version of this job used unprefixed supervisor-*
          # volume names, which collided with exactly that kind of
          # already-running container's own /var/lib/docker mount — two
          # independent nested dockerd processes fighting over the same
          # on-disk state, which left this job's own Supervisor unable to
          # start anything at all. Forcing removal first also makes
          # repeated local `act` runs safe if an earlier one was
          # interrupted before its own cleanup step ran.
          docker rm -f ha-supervisor-ci >/dev/null 2>&1 || true
          docker volume rm ci-supervisor-mnt ci-supervisor-docker-lib \
            ci-supervisor-containerd-lib >/dev/null 2>&1 || true

          # --cgroupns=host: disabling AppArmor (previous fix, still kept -
          # it's a legitimate no-cost hardening step on an ephemeral runner
          # regardless) didn't resolve a real GitHub Actions run's
          # `s6-ipcserver-socketbinder: fatal: unable to create socket:
          # Permission denied` wall inside hassio_supervisor's own log,
          # which turned out to be the actual blocker after all - the
          # add-on's own container log was completely empty (not slow to
          # populate, empty), meaning Supervisor's self-reported
          # `state: started` was simply wrong, not just premature. Root
          # cause: Docker 20.10+ defaults new containers to a *private*
          # cgroup namespace on a cgroup v2 host (GitHub's Ubuntu runners
          # use cgroup v2; --privileged alone does not change this), which
          # breaks tooling like this that needs the nested dockerd's own
          # containers to manage cgroups the way a *host* cgroup namespace
          # allows. This is a well-documented Docker/cgroup-v2 requirement
          # for nested/DinD-style containers generally, not specific to
          # this devcontainer image. Harmless to request unconditionally
          # (not gated by !env.ACT like the AppArmor step): on a cgroup v1
          # host, or one where this doesn't matter, it's a no-op.
          docker run -d --name ha-supervisor-ci --privileged \
            --cgroupns=host \
            -v ci-supervisor-mnt:/mnt/supervisor \
            -v ci-supervisor-docker-lib:/var/lib/docker \
            -v ci-supervisor-containerd-lib:/var/lib/containerd \
            ghcr.io/home-assistant/devcontainer:5-apps

          # Wait for the container's *own internal* Docker daemon (which its
          # entrypoint starts) to actually be responsive before invoking
          # supervisor_run — starting it immediately after `docker run -d`
          # assumes that daemon is already up, which is a race: `docker run
          # -d` only guarantees the entrypoint has *begun*, not that
          # everything it starts internally is ready yet. This is invisible
          # on a fast host where the daemon happens to initialize within the
          # gap before the next command runs, but not guaranteed in general.
          for i in $(seq 1 30); do
            if docker exec ha-supervisor-ci docker info >/dev/null 2>&1; then
              echo "Internal Docker daemon ready after ${i} check(s)"
              break
            fi
            if [ "$i" = 30 ]; then
              echo "Internal Docker daemon never became ready"
              docker logs ha-supervisor-ci || true
              exit 1
            fi
            sleep 2
          done

          # supervisor_run is started via `docker exec -d` (detached) so
          # this step can return immediately — but that means its own
          # output is *not* the container's entrypoint stdout/stderr, so
          # `docker logs ha-supervisor-ci` alone would never show it if it
          # fails. Redirect explicitly to a file inside the container that
          # the next step's failure branch can dump.
          docker exec -d ha-supervisor-ci sh -c \
            'supervisor_run > /tmp/supervisor_run.log 2>&1'

      - name: Wait for Supervisor to be ready
        run: |
          dump_diagnostics() {
            echo "--- docker ps -a (inside ha-supervisor-ci) ---"
            docker exec ha-supervisor-ci docker ps -a || true
            echo "--- supervisor_run output ---"
            docker exec ha-supervisor-ci cat /tmp/supervisor_run.log || true
            echo "--- ha-supervisor-ci container logs (its own entrypoint) ---"
            docker logs ha-supervisor-ci || true
          }

          for i in $(seq 1 30); do
            if docker exec ha-supervisor-ci docker ps --format '{{.Names}}' 2>/dev/null | grep -q '^hassio_cli$'; then
              echo "hassio_cli container up after ${i} check(s)"
              break
            fi
            echo "Waiting for Supervisor to bootstrap (attempt $i/30)..."
            if [ "$i" = 30 ]; then
              echo "Supervisor never became ready (hassio_cli container never appeared)"
              dump_diagnostics
              exit 1
            fi
            sleep 10
          done

          # hassio_cli existing is not the same as Supervisor itself being
          # ready to act on: verified locally that `ha apps info`/`ha
          # refresh-updates` right after this can still fail with "System
          # is not ready with state: setup" — Supervisor's own internal
          # state (surfaced by `ha info`, not `ha supervisor info`, which
          # has no state field at all) needs to reach "running" separately.
          #
          # `ha info` itself *exits non-zero* (`Error: System is not ready
          # with state: setup`) for as long as that's true - confirmed by
          # direct local probing. That matters here because act runs each
          # step as `bash -e`: capturing the command into a variable first
          # (`state_line=$(... ha info)`) is a plain assignment statement,
          # not the direct condition of an `if`/`while`, so set -e does NOT
          # exempt it - the very first "not ready" check killed the whole
          # step instantly instead of retrying (seen as a ~30s failure
          # instead of exhausting the timeout). Keeping the whole pipeline
          # as the `if` condition directly, like the loop above, is exempt
          # from set -e and retries correctly.
          for i in $(seq 1 60); do
            if docker exec ha-supervisor-ci docker exec hassio_cli ha info 2>/dev/null \
                | grep -q '^state: running$'; then
              echo "Supervisor state: running, after ${i} check(s)"
              exit 0
            fi
            echo "Waiting for Supervisor's own state to reach running (attempt $i/60)..."
            if [ "$i" = 60 ]; then
              echo "Supervisor's state never reached running"
              docker exec ha-supervisor-ci docker exec hassio_cli ha info || true
              dump_diagnostics
              exit 1
            fi
            sleep 5
          done

      - name: Copy add-on source into Supervisor's local apps
        run: |
          tar --exclude='node_modules' --exclude='.venv' --exclude='__pycache__' \
              --exclude='*.egg-info' --exclude='.pytest_cache' --exclude='.ruff_cache' \
              --exclude='static' -czf - blink_clip_downloader \
            | docker exec -i ha-supervisor-ci sh -c \
              'rm -rf /tmp/blink_build_ctx \
               && mkdir -p /tmp/blink_build_ctx \
               && tar -xzf - -C /tmp/blink_build_ctx --strip-components=1'
          docker exec ha-supervisor-ci sh -c \
            'rm -rf /mnt/supervisor/apps/local/blink_clip_downloader \
             && mkdir -p /mnt/supervisor/apps/local/blink_clip_downloader \
             && cp -r /tmp/blink_build_ctx/. /mnt/supervisor/apps/local/blink_clip_downloader/'

      - name: Discover the add-on
        run: |
          docker exec ha-supervisor-ci docker exec hassio_cli ha refresh-updates
          docker exec ha-supervisor-ci docker exec hassio_cli ha apps info local_blink_clip_downloader \
            | grep -q 'available: true'

      - name: Install the add-on through Supervisor (builds from source — takes several minutes)
        run: docker exec ha-supervisor-ci docker exec hassio_cli ha apps install local_blink_clip_downloader --raw-json

      - name: Start the add-on and confirm it reaches "started"
        run: |
          docker exec ha-supervisor-ci docker exec hassio_cli ha apps start local_blink_clip_downloader --raw-json
          for i in $(seq 1 20); do
            if docker exec ha-supervisor-ci docker exec hassio_cli ha apps info local_blink_clip_downloader \
                2>/dev/null | grep -q '^state: started$'; then
              echo "Add-on state: started, after ${i} check(s)"
              exit 0
            fi
            echo "Waiting for add-on state to reach started (attempt $i/20)..."
            sleep 3
          done
          echo "Add-on state never reached started"
          docker exec ha-supervisor-ci docker exec hassio_cli ha apps info local_blink_clip_downloader || true
          exit 1

      - name: Verify the media server responds through Supervisor
        run: |
          # Supervisor reporting the add-on state as "started" only means
          # the container process was launched, not that the app inside has
          # finished booting — this add-on's entrypoint initializes a brand
          # new PostgreSQL 17 data directory from scratch (no cache, unlike
          # every local `ha-supervisor-dev` run this project's manual
          # testing normally hits) before the Python app can even connect,
          # let alone bind its own port. A local `act` run on a fast,
          # otherwise-idle machine saw this succeed on the very first check
          # (well under a second); a real GitHub-hosted runner is slower
          # and more contended, and exhausted a 10-attempt/30s budget here
          # with *every* attempt failing (not "succeeded on a late attempt"),
          # consistent with this being a still-booting budget problem rather
          # than a genuine failure. Generous on purpose for that reason.
          for i in $(seq 1 40); do
            if docker exec ha-supervisor-ci docker exec addon_local_blink_clip_downloader \
                curl -fsS http://localhost:8099/health >/dev/null 2>&1; then
              echo "Media server is up, after ${i} check(s)"
              exit 0
            fi
            echo "Media server not reachable yet (attempt $i/40), retrying..."
            sleep 3
          done
          echo "Media server never became reachable"
          exit 1

      - name: Dump Supervisor and add-on logs on failure
        if: failure()
        run: |
          docker exec ha-supervisor-ci docker logs hassio_supervisor 2>&1 | tail -200 || true
          docker exec ha-supervisor-ci docker logs addon_local_blink_clip_downloader 2>&1 | tail -200 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f ha-supervisor-ci || true
          docker volume rm ci-supervisor-mnt ci-supervisor-docker-lib ci-supervisor-containerd-lib || true
