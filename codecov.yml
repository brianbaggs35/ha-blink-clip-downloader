---
codecov:
  require_ci_to_pass: false
coverage:
  status:
    project:
      default:
        # Scoped to backend+frontend only — the exact same combined-score
        # computation as before the e2e flag existed. Deliberately excludes
        # the e2e flag: istanbul (e2e) and v8 (frontend/vitest) count
        # statements differently for the same frontend/src files, so
        # merging them in here could move this number for reasons unrelated
        # to an actual coverage regression in either suite.
        target: 85%
        flags:
          - backend
          - frontend
      e2e:
        # Separate, informational-only check for the Playwright suite — a
        # visibility number (see CLAUDE.md's E2E coverage note), never
        # gates a PR and never affects the default check above.
        target: 0%
        informational: true
        flags:
          - e2e
    patch:
      default:
        # Same scoping (and same reason) as project.default above — without
        # an explicit flags: key here, Codecov pools the e2e/Istanbul flag
        # into patch coverage too. Istanbul doesn't understand this repo's
        # `v8 ignore` comments (Vitest/v8's own exclusion syntax) and can
        # diverge from v8 on line-vs-branch exclusion scope for the exact
        # same frontend/src files, so a line already correctly excluded from
        # Vitest's 100% can still show as a "patch" gap purely from e2e's
        # unrelated, informational-only coverage data.
        target: 80%
        flags:
          - backend
          - frontend
