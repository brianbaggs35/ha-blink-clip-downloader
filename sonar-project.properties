# SonarCloud project configuration.
#
# This repo holds two toolchains in one SonarCloud project: the Python
# add-on package (blink_clip_downloader/blink_downloader) and its Vue/
# TypeScript frontend (blink_clip_downloader/frontend/src) - see CLAUDE.md's
# "Two toolchains, not one" note. Coverage reports are produced by the
# `test` CI job (.github/workflows/ci.yaml) and downloaded as artifacts by
# the `sonarqube` job that runs this scan; running `sonar-scanner` locally
# without those files first in place will still analyze the code, just
# without coverage data.

sonar.projectKey=brianbaggs35_ha-blink-clip-downloader
sonar.organization=brianbaggs35
sonar.projectName=HA Blink Clip Downloader
sonar.sourceEncoding=UTF-8

# Main source roots for each toolchain.
sonar.sources=blink_clip_downloader/blink_downloader,blink_clip_downloader/frontend/src

# Test files are colocated with source files on the frontend side
# (Component.spec.ts beside Component.vue), not in a separate directory -
# sonar.tests points at both toolchains' test locations, and
# sonar.test.inclusions picks out which files within them are actually
# tests, so a *.spec.ts file is classified as a test while its sibling
# source file stays classified as main code.
sonar.tests=blink_clip_downloader/tests,blink_clip_downloader/frontend/src
sonar.test.inclusions=blink_clip_downloader/tests/**/test_*.py,blink_clip_downloader/frontend/src/**/*.spec.ts

# Generated output, vendored dependencies, and build artifacts - never
# hand-edited, not useful to scan. Mirrors .gitignore.
sonar.exclusions=\
  blink_clip_downloader/frontend/node_modules/**,\
  blink_clip_downloader/frontend/dist/**,\
  blink_clip_downloader/frontend/coverage/**,\
  blink_clip_downloader/blink_downloader/static/**,\
  blink_clip_downloader/blink_downloader.egg-info/**,\
  e2e/node_modules/**,\
  **/__pycache__/**

# Files excluded from coverage metrics specifically (still scanned for
# other issues) - mirrors pyproject.toml's [tool.coverage.run] omit list
# and vitest.config.ts's coverage.exclude list, so Sonar's coverage %
# doesn't penalize files this project already treats as untestable
# entrypoints/boilerplate.
sonar.coverage.exclusions=\
  blink_clip_downloader/blink_downloader/__main__.py,\
  blink_clip_downloader/frontend/src/main.ts,\
  blink_clip_downloader/frontend/src/test-setup.ts,\
  blink_clip_downloader/frontend/src/vite-env.d.ts,\
  e2e/**

# Python: multiple interpreter versions are supported (see CI's lint/test
# matrix); coverage.xml is generated by `pytest --cov-report=xml` at the
# repo root (../coverage.xml relative to blink_clip_downloader/, where
# pytest actually runs - see ci.yaml's "Run pytest with coverage" step).
sonar.python.version=3.12,3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml

# JS/TS: lcov.info comes from vitest.config.ts's coverage.reporter list
# (added alongside the cobertura report Codecov already consumed).
sonar.javascript.lcov.reportPaths=blink_clip_downloader/frontend/coverage/lcov.info
